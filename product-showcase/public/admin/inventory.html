<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Inventory | Cyndi Global — Guangzhou warehouse</title>
<style>
:root{--navy:#0f1f3a;--blue:#1e5a8a;--sky:#eef6fb;--text:#1a2a3a;--muted:#71849a;--line:#dce8f0;--orange:#e07a3a}
*{box-sizing:border-box}body{margin:0;background:var(--sky);color:var(--text);font-family:Arial,sans-serif}
header{padding:16px 5%;background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center}
header a{color:#cfe0ee;text-decoration:none;font-size:14px}header a.on{color:#fff;font-weight:700}
main{max-width:1600px;margin:24px auto;padding:0 16px}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 8px 24px #0f1f3a12;margin-bottom:16px}
.field{margin-bottom:12px}label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px}
textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;resize:vertical}
button{border:0;border-radius:8px;padding:9px 14px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer;font-size:13px}
button.secondary{background:#fff;color:var(--navy);border:1px solid var(--line)}
button.small{padding:5px 9px;font-size:12px}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,a:focus-visible,tr:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.msg{margin-top:10px;padding:10px;border-radius:8px;background:#e0f0f8;color:#176080;font-size:13px}
.msg.err{background:#fff1eb;color:#9a3d22}.msg.warn{background:#fff8e8;color:#6b4b00;border:1px solid #f0d9a8}.hidden{display:none!important}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar input{width:auto;flex:1;min-width:200px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
#rows tr{cursor:pointer}#rows tr:hover{background:#f7fafc}#rows tr.sel{background:#eef6fb}
.sub{color:var(--muted);font-size:11px}
code{font-size:12px}
h2{margin:0;font-size:20px;color:var(--navy)}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px}
.pill{display:inline-block;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:700;background:#eef1f4;color:#45566a;white-space:nowrap}
.pill.ok{background:#e8f8ef;color:#217753}.pill.low{background:#fff4e0;color:#8a5a00}
.pill.out{background:#f1e3e3;color:#9a3d22}.pill.untracked{background:#eef1f4;color:#45566a}
.mv-up{color:#217753;font-weight:600}.mv-down{color:#9a3d22;font-weight:600}
tr.pick{cursor:pointer}tr.pick:hover{background:#f7fafc}tr.pick.sel{background:#eef6fb;box-shadow:inset 3px 0 0 var(--orange)}
.hist-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:22px 0 8px}.hist-head h3{margin:0}
.swatch{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid var(--line);vertical-align:middle;margin-right:6px;background:#fff}
.empty{padding:28px;text-align:center;color:var(--muted)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:#0f1f3a55;z-index:20}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(440px,94%);max-height:92vh;overflow:auto;background:#fff;z-index:21;border-radius:12px;box-shadow:0 12px 32px #0f1f3a30;padding:22px}
.modal h2{font-size:18px;margin-bottom:4px}
@media(max-width:820px){.hide-sm{display:none}}
</style>
</head>
<body>
<header>
  <strong>CYNDI GLOBAL — ADMIN</strong>
  <nav class="row" style="gap:16px;align-items:center" aria-label="Admin" data-admin-auth-slot>
    <a href="/admin/">Home</a>
    <a href="/admin/products.html">Products</a>
    <a href="/admin/orders.html">Orders</a>
    <a href="/admin/customers.html">Customers</a>
    <a href="/admin/showcase.html">Showcase</a>
    <a href="/admin/inventory.html" class="on" aria-current="page">Inventory</a>
    <a href="/admin/logistics.html">Shipping</a>
  </nav>
</header>
<main>
  <section id="editorView" class="hidden">
    <div class="card">
      <h2>Inventory</h2>
      <div class="sub" style="margin:4px 0 14px">Guangzhou warehouse · Showcase products, per colour and size</div>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search product name / SKU / stock code…" aria-label="Search products" maxlength="100">
        <button class="secondary small" id="reload" type="button">Refresh</button>
        <span id="count" style="color:var(--muted);font-size:12px" aria-live="polite"></span>
      </div>
      <div id="msg" class="msg hidden" role="status"></div>
      <table>
        <thead><tr>
          <th scope="col">Product</th><th scope="col">Tracked</th>
          <th scope="col" class="num">Available</th><th scope="col" class="num">Reserved</th>
          <th scope="col" class="num hide-sm">Incoming</th><th scope="col" class="num hide-sm">Damaged</th>
          <th scope="col" class="num" title="Variants at or below their low-stock threshold">Low stock</th><th scope="col" class="num" title="Variants with 0 available">Out of stock</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <div class="card hidden" id="panel" aria-labelledby="pTitle">
      <div class="row" style="justify-content:space-between">
        <div>
          <h2 id="pTitle" tabindex="-1"></h2>
          <div id="pSub" class="sub" style="margin-top:4px"></div>
        </div>
        <div id="pActions" class="row"></div>
      </div>
      <div id="pMsg" class="msg hidden" role="alert"></div>
      <div id="pBody"></div>
    </div>
  </section>
</main>

<div id="overlay" class="overlay hidden"></div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="mTitle"></div>

<script src="/admin/admin-auth.js"></script>
<script>
// Product names, colour names, reasons and actors are rendered with textContent / DOM
// properties only (never innerHTML). Colour swatches use style.backgroundColor, set only
// after the hex passes a strict pattern.
const API='/api/admin/inventory';
const MAX_QTY=1000000;
const HEX_RE=/^#[0-9a-f]{3,8}$/i;
const state={q:'',products:[],productId:null,detail:null,lastFocus:null,historySku:null};

function $(id){return document.getElementById(id)}
function show(el,text,err){el.textContent=text;el.className='msg'+(err?' err':'');el.classList.remove('hidden')}
function hide(el){el.classList.add('hidden')}
function h(tag,props,...kids){
  const n=document.createElement(tag);
  if(props)for(const [k,v] of Object.entries(props)){
    if(v==null||v===false)continue;
    if(k==='class')n.className=v;
    else if(k==='text')n.textContent=v;
    else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);
    else n.setAttribute(k,String(v));
  }
  for(const c of kids.flat()){if(c==null||c===false)continue;n.appendChild(typeof c==='object'?c:document.createTextNode(String(c)))}
  return n;
}
function clear(n){while(n.firstChild)n.removeChild(n.firstChild)}

class AuthError extends Error{}
async function api(url,opts){
  const r=await fetch(url,Object.assign({credentials:'same-origin'},opts||{}));
  const b=await r.json().catch(()=>({}));
  if(r.status===401){showLogin();throw new AuthError('Please sign in again');}
  if(!r.ok){const e=new Error(b.error||'Request failed');e.status=r.status;e.body=b;throw e;}
  return b;
}
function post(body){return api(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}

function showLogin(){closeForm();AdminAuth.requireLogin()}
function showEditor(){$('editorView').classList.remove('hidden')}
function fmtDate(v){if(!v)return '—';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'})}
function num(v){return v==null?'—':String(v)}
function signed(v){const n=Number(v)||0;return n>0?'+'+n:String(n)}
function swatch(hex){const s=h('span',{class:'swatch','aria-hidden':'true'});if(typeof hex==='string'&&HEX_RE.test(hex))s.style.backgroundColor=hex;return s}
function statusPill(v){
  if(!v.tracked)return h('span',{class:'pill untracked',text:'Untracked'});
  if(v.out)return h('span',{class:'pill out',text:'Out of stock'});
  if(v.low)return h('span',{class:'pill low',text:'Low'});
  return h('span',{class:'pill ok',text:'In stock'});
}
function colourLabel(v){return v.colorName||(v.colorId===''?'—':'(unnamed colour)')}
function sizeLabel(s){return s||'—'}
function migrationMessage(el){show(el,'Run migration 0013_inventory.sql first',true)}

// ---------- Product list ----------
async function loadProducts(){
  const rows=$('rows');
  try{
    const b=await api(API+(state.q?'?q='+encodeURIComponent(state.q):''));
    clear(rows);
    if(b.migrationRequired){migrationMessage($('msg'));$('count').textContent='';return}
    hide($('msg'));
    state.products=b.products||[];
    $('count').textContent=state.products.length+' product'+(state.products.length===1?'':'s');
    if(!state.products.length){rows.appendChild(h('tr',null,h('td',{colspan:8,class:'empty',text:'No products found.'})));return}
    for(const p of state.products){
      const tr=h('tr',{tabindex:0,'aria-label':'Open '+p.name,class:p.id===state.productId?'sel':null,
        onclick:()=>openProduct(p.id,tr),
        onkeydown:e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openProduct(p.id,tr)}}},
        h('td',null,h('strong',{text:p.name}),h('div',{class:'sub',text:p.deleted?'Removed from the Showcase · stock kept':(p.sku||p.id)})),
        h('td',{text:p.deleted?p.trackedCount+' stock row'+(p.trackedCount===1?'':'s'):p.trackedCount+' of '+p.variantCount}),
        h('td',{class:'num',text:p.trackedCount?String(p.available):'—'}),
        h('td',{class:'num',text:p.trackedCount?String(p.reserved):'—'}),
        h('td',{class:'num hide-sm',text:p.trackedCount?String(p.incoming):'—'}),
        h('td',{class:'num hide-sm',text:p.trackedCount?String(p.damaged):'—'}),
        h('td',{class:'num'},p.lowCount?h('span',{class:'pill low',text:p.lowCount+' of '+p.variantCount}):('0 of '+p.variantCount)),
        h('td',{class:'num'},p.outCount?h('span',{class:'pill out',text:p.outCount+' of '+p.variantCount}):('0 of '+p.variantCount)));
      rows.appendChild(tr);
    }
  }catch(e){if(!(e instanceof AuthError))show($('msg'),'Could not load products: '+e.message,true)}
}

// ---------- One product ----------
async function openProduct(id,focusFrom){
  if(id!==state.productId)state.historySku=null;   // history filter is per product
  state.productId=id;
  document.querySelectorAll('#rows tr').forEach(tr=>tr.classList.remove('sel'));
  if(focusFrom)focusFrom.classList.add('sel');
  try{
    const d=await api(API+'?productId='+encodeURIComponent(id));
    state.detail=d;
    renderPanel(d);
  }catch(e){if(!(e instanceof AuthError)){$('panel').classList.remove('hidden');show($('pMsg'),'Could not load the product: '+e.message,true)}}
}

async function refreshProduct(){
  await Promise.all([state.productId?openProduct(state.productId):null,loadProducts()]);
}

function renderPanel(d){
  const panel=$('panel'),body=$('pBody'),acts=$('pActions');
  panel.classList.remove('hidden');hide($('pMsg'));clear(body);clear(acts);
  if(d.migrationRequired){$('pTitle').textContent='Inventory';$('pSub').textContent='';migrationMessage($('pMsg'));return}
  const p=d.product,variants=d.variants||[];
  $('pTitle').textContent=p.name;
  $('pSub').textContent='Guangzhou warehouse · '+(p.sku||p.id);
  const tracked=variants.filter(v=>v.tracked).length;
  const untracked=variants.length-tracked;
  if(untracked>0){
    const label=tracked?'Track '+untracked+' new variant'+(untracked===1?'':'s'):'Start tracking';
    acts.appendChild(h('button',{type:'button',text:label,onclick:()=>trackAll(untracked,!tracked)}));
  }
  const open=d.openOrders||{count:0,quantity:0,orders:[]};
  if(open.count>0){
    const list=(open.orders||[]).map(o=>o.orderNo+' ('+o.status+', '+o.quantity+')').join(', ');
    body.appendChild(h('div',{class:'msg warn',role:'note'},
      h('strong',{text:open.count+' open order'+(open.count===1?'':'s')+' placed before tracking: '+open.quantity+' unit'+(open.quantity===1?'':'s')+'.'}),
      ' These pending/processing orders did not reserve stock, so shipping or cancelling them will not change the numbers here. Subtract them from the opening stock. ',
      list?h('div',{class:'sub',text:'Orders: '+list+(open.count>(open.orders||[]).length?' …':'')}):null));
  }
  if(p.deleted){
    body.appendChild(h('div',{class:'msg warn',role:'note'},
      h('strong',{text:'This product was deleted from the Showcase.'}),
      ' Its stock rows are kept below. Re-creating the product with the same id and colours links them again.'));
  }
  if(p.colorsMissingIds){
    body.appendChild(h('p',{class:'sub',text:'Some colours have no stable id yet. "'+(tracked?'Track new variants':'Start tracking')+'" assigns ids; per-variant tracking is available afterwards.'}));
  }

  const tbody=h('tbody');
  if(!p.deleted)for(const v of variants){
    const actions=h('div',{class:'actions'});
    if(v.tracked){
      actions.append(
        h('button',{type:'button',class:'secondary small',text:'Set','aria-label':'Set available for '+colourLabel(v)+' '+sizeLabel(v.size),onclick:e=>formSet(v,e.currentTarget)}),
        h('button',{type:'button',class:'secondary small',text:'Adjust','aria-label':'Adjust available for '+colourLabel(v)+' '+sizeLabel(v.size),onclick:e=>formAdjust(v,e.currentTarget)}),
        h('button',{type:'button',class:'secondary small',text:'Threshold','aria-label':'Low-stock threshold for '+colourLabel(v)+' '+sizeLabel(v.size),onclick:e=>formThreshold(v,e.currentTarget)}));
    }else if(!p.colorsMissingIds&&v.colorId!==null){
      actions.append(h('button',{type:'button',class:'secondary small',text:'Track','aria-label':'Track '+colourLabel(v)+' '+sizeLabel(v.size),onclick:e=>formTrackOne(v,e.currentTarget)}));
    }
    // Action controls must not select the row (clicks or Enter/Space on the buttons).
    actions.addEventListener('click',e=>e.stopPropagation());
    actions.addEventListener('keydown',e=>e.stopPropagation());
    const pickable=v.tracked&&!!v.sku;
    const vLabel=colourLabel(v)+' / '+sizeLabel(v.size);
    const rowProps=pickable?{class:'pick'+(state.historySku===v.sku?' sel':''),tabindex:0,
      'data-sku':v.sku,'aria-label':'Show stock history for '+vLabel,
      'aria-current':state.historySku===v.sku?'true':null,
      onclick:()=>selectHistoryVariant(v.sku),
      onkeydown:e=>{if(e.target===e.currentTarget&&(e.key==='Enter'||e.key===' ')){e.preventDefault();selectHistoryVariant(v.sku)}}}:null;
    tbody.appendChild(h('tr',rowProps,
      h('td',null,v.colorId===''?null:swatch(v.colorHex),colourLabel(v)),
      h('td',{text:sizeLabel(v.size)}),
      h('td',{class:'num',text:v.tracked?String(v.available):'—'}),
      h('td',{class:'num',text:v.tracked?String(v.reserved):'—'}),
      h('td',{class:'num',text:v.tracked?String(v.incoming):'—'}),
      h('td',{class:'num',text:v.tracked?String(v.damaged):'—'}),
      h('td',{class:'num',text:v.tracked?num(v.threshold):'—'}),
      h('td',{class:'num',text:v.tracked?String(v.shipped||0):'—'}),
      h('td',{class:'num',text:v.openOrderQty?String(v.openOrderQty):'—'}),
      h('td',null,statusPill(v)),
      h('td',{class:'hide-sm',text:v.tracked?fmtDate(v.updatedAt):'—'}),
      h('td',null,actions)));
  }
  if(!p.deleted)body.appendChild(h('table',null,
    h('thead',null,h('tr',null,
      h('th',{scope:'col',text:'Colour'}),h('th',{scope:'col',text:'Size'}),
      h('th',{scope:'col',class:'num',text:'Available'}),h('th',{scope:'col',class:'num',text:'Reserved'}),
      h('th',{scope:'col',class:'num',text:'Incoming'}),h('th',{scope:'col',class:'num',text:'Damaged'}),
      h('th',{scope:'col',class:'num',text:'Threshold'}),
      h('th',{scope:'col',class:'num',title:'Total units shipped out (from the stock history, read-only)',text:'Total shipped'}),
      h('th',{scope:'col',class:'num',title:'Units on pending/processing orders placed before tracking (not reserved)',text:'Open before tracking'}),
      h('th',{scope:'col',text:'Status'}),
      h('th',{scope:'col',class:'hide-sm',text:'Updated'}),h('th',{scope:'col',text:'Actions'}))),
    tbody));
  if(!p.deleted)body.appendChild(h('p',{class:'sub',text:'Reserved changes only with orders. Incoming and Damaged are read-only for now. Click a tracked variant to see only its stock history.'}));

  if((d.unlinked||[]).length){
    body.appendChild(h('h3',{text:p.deleted?'Stock rows':'No longer matches the product'}));
    body.appendChild(h('p',{class:'sub',text:p.deleted
      ?'These stock rows belonged to the deleted product. They are read-only.'
      :'These stock rows belong to a colour or size that was removed or renamed. They are read-only.'}));
    const ub=h('tbody');
    for(const u of d.unlinked){
      ub.appendChild(h('tr',null,h('td',null,h('code',{text:u.sku})),h('td',{text:u.colorId||'—'}),h('td',{text:sizeLabel(u.size)}),
        h('td',{class:'num',text:String(u.available)}),h('td',{class:'num',text:String(u.reserved)}),
        h('td',{class:'num',text:String(u.incoming)}),h('td',{class:'num',text:String(u.damaged)})));
    }
    body.appendChild(h('table',null,h('thead',null,h('tr',null,
      h('th',{scope:'col',text:'Stock code'}),h('th',{scope:'col',text:'Colour id'}),h('th',{scope:'col',text:'Size'}),
      h('th',{scope:'col',class:'num',text:'Available'}),h('th',{scope:'col',class:'num',text:'Reserved'}),
      h('th',{scope:'col',class:'num',text:'Incoming'}),h('th',{scope:'col',class:'num',text:'Damaged'}))),ub));
  }

  renderHistory(body,d,variants);
}

// ---------- Stock history (read-only) ----------
// Fields come from movementOut() in functions/api/admin/inventory.js: id, sku, type,
// dAvailable, dReserved, dIncoming, dDamaged, availableAfter, reservedAfter, incomingAfter,
// damagedAfter, reason, refOrderNo, actor, createdAt. The API returns the newest 50 (ORDER BY id DESC LIMIT 50).
const MOVEMENT_LIMIT=50;
const MOVEMENT_LABELS={
  track:'Tracking enabled',untrack:'Tracking stopped',stocktake:'Stocktake',
  set:'Stock set',adjust:'Adjusted',threshold:'Low-stock threshold',
  incoming:'Incoming expected',receive:'Received into stock',
  damage:'Marked damaged',repair:'Repaired',writeoff:'Written off',
  reserve:'Order placed',release:'Order cancelled',
  ship:'Shipped out',unship:'Shipment reversed',relink:'Relinked to product'
};
function movementLabel(t){return Object.prototype.hasOwnProperty.call(MOVEMENT_LABELS,t)?MOVEMENT_LABELS[t]:String(t||'—')}
// Buckets in display order: label, delta field, after-balance field.
const MOVEMENT_BUCKETS=[
  ['Available','dAvailable','availableAfter'],['Reserved','dReserved','reservedAfter'],
  ['Incoming','dIncoming','incomingAfter'],['Damaged','dDamaged','damagedAfter']
];
// Only the buckets this movement actually changed (non-zero delta).
function changedBuckets(m){return MOVEMENT_BUCKETS.filter(b=>(Number(m[b[1]])||0)!==0)}
// "Change": e.g. "Available -1 · Reserved +1", deltas coloured; nothing changed -> "—".
function changeCell(m,changed){
  const td=h('td',{style:'white-space:nowrap'});
  if(!changed.length){td.textContent='—';return td}
  changed.forEach(([label,dk],i)=>{
    const n=Number(m[dk])||0;
    if(i)td.appendChild(document.createTextNode(' · '));
    td.append(label+' ',h('span',{class:n>0?'mv-up':'mv-down',text:signed(n)}));
  });
  return td;
}
// "Balance after": the after-balance of the changed buckets only, e.g. "Reserved 4".
function balanceCell(m,changed){
  const text=changed.length?changed.map(([label,,ak])=>label+' '+num(m[ak])).join(' · '):'—';
  return h('td',{style:'white-space:nowrap',text});
}
function historyNames(d,variants){
  // sku -> "Colour / Size" from the matrix (tracked variants) and unlinked rows.
  const names=new Map();
  for(const v of variants)if(v.tracked&&v.sku)names.set(v.sku,colourLabel(v)+' / '+sizeLabel(v.size));
  for(const u of d.unlinked||[])if(!names.has(u.sku))names.set(u.sku,(u.colorId||'—')+' / '+sizeLabel(u.size)+' (unlinked)');
  return names;
}
function renderHistory(body,d,variants){
  // Drop a selection that no longer matches a clickable (tracked) variant, e.g. after untracking.
  if(state.historySku&&!variants.some(v=>v.tracked&&v.sku===state.historySku))state.historySku=null;
  const box=h('div',{id:'histBox'});
  body.appendChild(box);
  drawHistory(box,d,historyNames(d,variants));
}
// Pure front-end filter over the already-fetched movements; no refetch.
function selectHistoryVariant(sku){
  state.historySku=state.historySku===sku?null:sku;
  document.querySelectorAll('#pBody tr.pick').forEach(tr=>{
    const on=tr.getAttribute('data-sku')===state.historySku;
    tr.classList.toggle('sel',on);
    if(on)tr.setAttribute('aria-current','true');else tr.removeAttribute('aria-current');
  });
  const box=$('histBox'),d=state.detail;
  if(box&&d){clear(box);drawHistory(box,d,historyNames(d,d.variants||[]))}
}
function drawHistory(box,d,names){
  const sel=state.historySku;
  const head=h('div',{class:'hist-head'},
    h('h3',{text:sel?'Stock history — '+(names.get(sel)||sel):'Stock history'}),
    sel?h('button',{type:'button',class:'secondary small',text:'Show all variants',onclick:()=>{
      // The button disappears on clear; return focus to the variant row it came from.
      const row=[...document.querySelectorAll('#pBody tr.pick')].find(tr=>tr.getAttribute('data-sku')===sel);
      selectHistoryVariant(sel);if(row)row.focus();
    }}):null);
  box.appendChild(head);
  const all=d.movements||[];
  const mv=sel?all.filter(m=>m.sku===sel):all;
  if(!mv.length){box.appendChild(h('p',{class:'sub',role:'status',text:sel?'No stock movements for this variant yet.':'No stock movements yet.'}));return}
  box.appendChild(h('p',{class:'sub',role:'status',text:'Read-only log, newest first.'
    +(sel?' Showing '+mv.length+' movement'+(mv.length===1?'':'s')+' for this variant.':'')
    +(all.length>=MOVEMENT_LIMIT?' Based on the most recent '+MOVEMENT_LIMIT+' movements of this product.':'')}));
  const mb=h('tbody');
  for(const m of mv){
    const variant=names.get(m.sku);
    const changed=changedBuckets(m);
    mb.appendChild(h('tr',null,
      h('td',{style:'white-space:nowrap',text:fmtDate(m.createdAt)}),
      h('td',null,h('span',{class:'pill',title:(m.actor?'By '+m.actor+' · ':'')+String(m.type||''),text:movementLabel(m.type)})),
      h('td',null,variant?h('div',{text:variant}):null,h('code',{text:m.sku||'—'})),
      changeCell(m,changed),
      balanceCell(m,changed),
      h('td',{text:m.refOrderNo||'—'}),
      h('td',{text:m.reason||'—'})));
  }
  box.appendChild(h('div',{style:'max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:8px'},
    h('table',null,h('thead',null,h('tr',null,
      h('th',{scope:'col',text:'Time'}),h('th',{scope:'col',text:'Event'}),h('th',{scope:'col',text:'Variant'}),
      h('th',{scope:'col',text:'Change'}),h('th',{scope:'col',text:'Balance after'}),
      h('th',{scope:'col',text:'Order no'}),h('th',{scope:'col',text:'Reason'}))),mb)));
}

function openOrdersWarning(){
  const o=state.detail&&state.detail.openOrders;
  if(!o||!o.count)return '';
  return '\n\n'+o.count+' open order'+(o.count===1?'':'s')+' (pending/processing) placed before tracking include '+o.quantity+' unit'+(o.quantity===1?'':'s')+' of this product. They do not reserve stock: subtract them from the opening stock.';
}
async function trackAll(n,first){
  const msg=(first
    ?'Start tracking all '+n+' variant'+(n===1?'':'s')+' of this product at 0 available? Customers will see them as out of stock until you set the stock.'
    :'Track '+n+' new variant'+(n===1?'':'s')+' at 0 available?')+openOrdersWarning();
  if(!confirm(msg))return;
  try{
    const r=await post({op:'track',productId:state.productId});
    await refreshProduct();
    show($('pMsg'),'Tracking started for '+r.created+' variant'+(r.created===1?'':'s')+'.',false);
  }catch(e){if(!(e instanceof AuthError))show($('pMsg'),e.message,true)}
}

// ---------- Small forms (dialog) ----------
function closeForm(){
  hide($('modal'));hide($('overlay'));clear($('modal'));
  if(state.lastFocus&&document.contains(state.lastFocus))state.lastFocus.focus();
  state.lastFocus=null;
}
// fields: [{name,label,type:'number'|'textarea',value,required,min,max,maxlength,hint}]
function openForm({title,sub,fields,submitLabel,onSubmit,onInput},from){
  state.lastFocus=from||document.activeElement;
  const m=$('modal');clear(m);
  const err=h('div',{class:'msg err hidden',role:'alert'});
  const form=h('form',{novalidate:true});
  for(const f of fields){
    const id='f_'+f.name;
    const input=f.type==='textarea'
      ?h('textarea',{id,name:f.name,rows:3,maxlength:f.maxlength||500,required:f.required||null})
      :h('input',{id,name:f.name,type:'number',step:1,min:f.min,max:f.max,required:f.required||null,inputmode:'numeric'});
    input.value=f.value==null?'':String(f.value);
    form.appendChild(h('div',{class:'field'},h('label',{for:id,text:f.label+(f.required?' (required)':'')}),input,f.hint?h('div',{class:'sub',text:f.hint}):null));
  }
  const submit=h('button',{type:'submit',text:submitLabel});
  form.appendChild(err);
  form.appendChild(h('div',{class:'row',style:'justify-content:flex-end;margin-top:12px'},
    h('button',{type:'button',class:'secondary',text:'Cancel',onclick:closeForm}),submit));
  if(onInput)form.addEventListener('input',()=>onInput(form));
  form.addEventListener('submit',async e=>{
    e.preventDefault();hide(err);
    submit.disabled=true;
    try{
      const res=await onSubmit(form);
      if(res&&res.error){show(err,res.error,true);return}
      closeForm();
      await refreshProduct();
      if(res&&res.done)show($('pMsg'),res.done,false);
    }catch(ex){if(!(ex instanceof AuthError))show(err,ex.message,true)}
    finally{submit.disabled=false}
  });
  m.appendChild(h('h2',{id:'mTitle',text:title}));
  if(sub)m.appendChild(h('div',{class:'sub',style:'margin-bottom:12px',text:sub}));
  m.appendChild(form);
  $('overlay').classList.remove('hidden');m.classList.remove('hidden');
  const first=form.querySelector('input,textarea');if(first){first.focus();if(first.select)first.select()}
}
function intValue(form,name,{allowEmpty=false,min=0,max=MAX_QTY,label}={}){
  const raw=form.elements[name].value.trim();
  if(raw===''){return allowEmpty?{value:null}:{error:label+' is required'}}
  const n=Number(raw);
  if(!Number.isInteger(n)||n<min||n>max)return {error:label+' must be a whole number from '+min+' to '+max};
  return {value:n};
}
function reasonValue(form,required){
  const v=form.elements.reason.value.trim();
  if(required&&!v)return {error:'A reason is required'};
  if(v.length>500)return {error:'Reason is too long (max 500)'};
  return {value:v};
}
function variantTitle(v){return colourLabel(v)+' / '+sizeLabel(v.size)}

function formSet(v,from){
  openForm({title:'Set available',sub:variantTitle(v)+' · '+v.sku+' · now '+v.available+' available',submitLabel:'Set',
    fields:[{name:'available',label:'Available',type:'number',value:v.available,min:0,max:MAX_QTY,required:true},
            {name:'reason',label:'Reason',type:'textarea',required:true}],
    async onSubmit(form){
      const a=intValue(form,'available',{label:'Available'});if(a.error)return a;
      const r=reasonValue(form,true);if(r.error)return r;
      await post({op:'set',sku:v.sku,available:a.value,expected:v.available,reason:r.value});
      return {done:v.sku+': available set to '+a.value+'.'};
    }},from);
}
function formAdjust(v,from){
  openForm({title:'Adjust available',sub:variantTitle(v)+' · '+v.sku+' · now '+v.available+' available',submitLabel:'Adjust',
    fields:[{name:'delta',label:'Change (e.g. 10 or -3)',type:'number',value:'',min:-MAX_QTY,max:MAX_QTY,required:true},
            {name:'reason',label:'Reason',type:'textarea',required:true}],
    async onSubmit(form){
      const d=intValue(form,'delta',{label:'Change',min:-MAX_QTY});if(d.error)return d;
      if(d.value===0)return {error:'Change must not be 0'};
      const r=reasonValue(form,true);if(r.error)return r;
      await post({op:'adjust',sku:v.sku,delta:d.value,reason:r.value});
      return {done:v.sku+': available '+signed(d.value)+'.'};
    }},from);
}
function formThreshold(v,from){
  openForm({title:'Low-stock threshold',sub:variantTitle(v)+' · '+v.sku,submitLabel:'Save',
    fields:[{name:'threshold',label:'Threshold',type:'number',value:v.threshold,min:0,max:MAX_QTY,hint:'Leave empty to clear. "Low" shows when available is at or below this number.'},
            {name:'reason',label:'Reason',type:'textarea'}],
    async onSubmit(form){
      const t=intValue(form,'threshold',{label:'Threshold',allowEmpty:true});if(t.error)return t;
      const r=reasonValue(form,false);if(r.error)return r;
      await post({op:'threshold',sku:v.sku,threshold:t.value,reason:r.value||undefined});
      return {done:v.sku+': threshold '+(t.value===null?'cleared':'set to '+t.value)+'.'};
    }},from);
}
function formTrackOne(v,from){
  const reasonRequired=form=>{const n=Number(form.elements.available.value);return Number.isFinite(n)&&n>0};
  const syncReason=form=>{
    const req=reasonRequired(form),el=form.elements.reason,lbl=form.querySelector('label[for="f_reason"]');
    el.required=req;lbl.textContent='Reason'+(req?' (required)':'');
  };
  const openQty=v.openOrderQty||0;
  openForm({title:'Track variant',
    sub:variantTitle(v)+(openQty?' · '+openQty+' unit'+(openQty===1?'':'s')+' on open orders placed before tracking (not reserved): subtract them from the opening stock.':''),
    submitLabel:'Start tracking',
    fields:[{name:'available',label:'Opening available',type:'number',value:0,min:0,max:MAX_QTY,required:true},
            {name:'threshold',label:'Low-stock threshold',type:'number',value:'',min:0,max:MAX_QTY,hint:'Optional.'},
            {name:'reason',label:'Reason',type:'textarea',hint:'Required when the opening stock is above 0.'}],
    onInput:syncReason,
    async onSubmit(form){
      const a=intValue(form,'available',{label:'Opening available'});if(a.error)return a;
      const t=intValue(form,'threshold',{label:'Threshold',allowEmpty:true});if(t.error)return t;
      const r=reasonValue(form,a.value>0);if(r.error)return r;
      const res=await post({op:'track',productId:state.productId,reason:r.value||undefined,
        variants:[{colorId:v.colorId,size:v.size,available:a.value,threshold:t.value}]});
      return {done:res.created?'Tracking started for '+variantTitle(v)+'.':'This variant is already tracked.'};
    }},from);
}

// ---------- Wiring ----------
let searchTimer=null;
$('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{state.q=$('search').value.trim().slice(0,100);loadProducts()},250)});
$('reload').addEventListener('click',()=>{hide($('msg'));refreshProduct()});
$('overlay').addEventListener('click',closeForm);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modal').classList.contains('hidden'))closeForm()});
AdminAuth.require({onReady(){showEditor();loadProducts();}});
</script>
