<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Showcase Editor | Cyndi Global</title>
<style>
:root{--navy:#0f1f3a;--blue:#1e5a8a;--sky:#eef6fb;--text:#1a2a3a;--muted:#71849a;--line:#dce8f0;--orange:#e07a3a;--orange-dk:#b7410e}
*{box-sizing:border-box}body{margin:0;background:var(--sky);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{padding:16px 5%;background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
header a{color:#cfe0ee;text-decoration:none;font-size:14px}
header a.on{color:#fff;font-weight:700}
main{max-width:1200px;margin:24px auto;padding:0 16px 80px}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 8px 24px #0f1f3a12;margin-bottom:16px}
.login-card{max-width:420px;margin:48px auto}
h1{margin:0 0 6px;font-size:22px}h2{font-size:16px;margin:0 0 12px}h3{font-size:13px;margin:0 0 8px}
.field{margin-bottom:12px}label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit}
textarea{min-height:70px;resize:vertical}
button{border:0;border-radius:8px;padding:9px 14px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer;font-size:13px}
button:hover{opacity:.9}
button.secondary{background:#fff;color:var(--navy);border:1px solid var(--line)}
button.small{padding:5px 9px;font-size:12px}
button.danger{background:var(--orange-dk)}
button.ghost{background:transparent;color:var(--blue);border:1px dashed var(--line)}
.msg{margin-top:10px;padding:10px;border-radius:8px;background:#e0f0f8;color:#176080;font-size:13px;white-space:pre-wrap}
.msg.err{background:#fff1eb;color:#9a3d22}.msg.ok{background:#e8f8ef;color:#217753}
.hidden{display:none!important}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;color:var(--muted)}
.thumb{width:52px;height:52px;object-fit:contain;background:#f2efe9;border-radius:6px;border:1px solid var(--line)}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar input{width:auto;flex:1;min-width:180px}
.toolbar select{width:auto}
.pill{display:inline-block;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:700;background:#eef6fb;color:var(--blue)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sub{background:#f7fafc;border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:10px}
.sub-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sub-head b{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--blue)}
.tag{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:3px 8px;font-size:12px}
.tag button{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 0 0 2px;font-size:14px;line-height:1}
.swatch-dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:0 0 auto}
.preview{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fbfdff;margin-bottom:12px}
.preview-head{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--blue);font-weight:700;margin-bottom:8px}
.list-row{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:8px;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:#fff;color:var(--navy);border:1px solid var(--line);font-weight:600}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.img-upload{border:1px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;background:#fbfdff}
.img-upload:hover{border-color:var(--blue);color:var(--blue)}
.img-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.img-grid img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.img-tile{position:relative;width:72px;cursor:pointer;border-radius:8px;outline:2px solid transparent;outline-offset:2px}
.img-tile img{width:72px;height:72px;display:block}
.img-tile:hover{outline-color:var(--line)}
.img-tile.main{outline-color:var(--orange)}
.img-tile .badge{position:absolute;left:0;bottom:0;background:var(--orange);color:#fff;font-size:9px;font-weight:700;
  padding:2px 5px;border-radius:0 0 0 8px;letter-spacing:.03em}
.img-tile .del{position:absolute;right:-5px;top:-5px;width:20px;height:20px;border-radius:50%;background:#111;color:#fff;
  border:none;font-size:12px;line-height:1;cursor:pointer;display:none}
.img-tile:hover .del{display:block}
.img-hint{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
.hint{font-size:12px;color:var(--muted);line-height:1.6}
.sticky-save{position:sticky;bottom:0;background:#fff;padding:14px 0 0;border-top:1px solid var(--line);margin-top:14px}
.two-col{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start}
.cat-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.cat-item:hover{background:#f7fafc}
.cat-item.on{background:#eef6fb;border-color:var(--blue);font-weight:700}
@media(max-width:820px){.two-col,.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <strong>CYNDI GLOBAL — ADMIN</strong>
  <div class="row" style="gap:16px;align-items:center">
    <a href="/admin/">Home</a>
    <a href="/admin/products">Products</a>
    <a href="/admin/orders.html">Orders</a>
    <a href="/admin/showcase" class="on">Showcase</a>
    <a href="/admin/logistics.html">Shipping</a>
    <a href="#" id="logout">Log out</a>
  </div>
</header>
<main>
  <!-- Login -->
  <section id="loginView" class="card login-card">
    <h1>Showcase editor</h1>
    <p class="hint" style="margin:0 0 16px">Manage the products published at www.cyndiglobal.com/showcase/.</p>
    <form id="loginForm">
      <div class="field"><label for="username">Admin username</label><input id="username" type="text" autocomplete="username" required></div>
      <div class="field"><label for="password">Admin password</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button type="submit">Sign in</button>
    </form>
    <div id="loginMsg" class="msg err hidden"></div>
  </section>

  <!-- Editor -->
  <section id="editorView" class="hidden">
    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:flex-start">
        <div>
          <h2 style="margin:0">Product catalogue</h2>
          <p class="hint" style="margin:4px 0 0">Changes take effect as soon as you save — no rebuild required.</p>
        </div>
        <div class="row">
          <button class="secondary small" id="reload">Reload</button>
          <a href="/showcase/" target="_blank" class="pill" style="text-decoration:none">Preview live site ↗</a>
        </div>
      </div>
      <div id="msg" class="msg hidden"></div>
    </div>

    <div class="tabs">
      <button data-tab="categories" class="on">Categories</button>
      <button data-tab="products">Products</button>
      <button data-tab="meta">Page info</button>
    </div>

    <!-- Categories -->
    <div id="tab-categories" class="card">
      <div class="toolbar">
        <input id="newCatName" placeholder="Category name, e.g. Drinkware">
        <input id="newCatId" placeholder="English id, e.g. drinkware (used as the URL anchor)" style="max-width:260px">
        <button id="addCat">Add category</button>
      </div>
      <div id="catList"></div>
    </div>

    <!-- Products -->
    <div id="tab-products" class="card hidden">
      <div class="toolbar">
        <input id="psearch" placeholder="Search by product name / SKU…">
        <select id="pcat"><option value="">All categories</option></select>
        <button id="addProd">Add product</button>
      </div>
      <div id="prodList"></div>
    </div>

    <!-- Page info -->
    <div id="tab-meta" class="card hidden">
      <h2>Page info</h2>
      <div class="grid2">
        <div class="field"><label>Page title (SHOWCASE)</label><input id="m_title"></div>
        <div class="field"><label>Subtitle</label><input id="m_subtitle"></div>
        <div class="field"><label>Project name</label><input id="m_projectName"></div>
        <div class="field"><label>Date</label><input id="m_date"></div>
      </div>
      <div class="field"><label>Recipients (one per line — name, email)</label><textarea id="m_recipients"></textarea></div>
      <div class="field"><label>Linked jobs (one per line — label, value)</label><textarea id="m_jobs"></textarea></div>
      <div class="field"><label>Disclaimer</label><textarea id="m_disclaimer" style="min-height:90px"></textarea></div>
      <button id="saveMeta">Save page info</button>
    </div>
  </section>
</main>

<script>
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function showMsg(text,kind){const el=$('msg');el.textContent=text;el.className='msg'+(kind?' '+kind:'');el.classList.remove('hidden');if(kind==='ok')setTimeout(()=>el.classList.add('hidden'),2500)}
async function api(url,opts){const r=await fetch(url,opts||{});const b=await r.json().catch(()=>({}));if(!r.ok)throw new Error(b.error||('HTTP '+r.status));return b}

   ------------------------------------------------------------------ */

// sRGB -> linear -> XYZ -> CIELAB
function hexToRgb(hex){
  const h=String(hex||'').replace('#','').trim();
  if(!/^[0-9a-fA-F]{6}$/.test(h))return null;
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
}
function rgbToLab(rgb){
  const lin=rgb.map(v=>{
    const c=v/255;
    return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4);
  });
  const [r,g,b]=lin;
  let x=(r*0.4124+g*0.3576+b*0.1805)/0.95047;
  let y=(r*0.2126+g*0.7152+b*0.0722);
  let z=(r*0.0193+g*0.1192+b*0.9505)/1.08883;
  const f=t=>t>0.008856?Math.cbrt(t):(7.787*t+16/116);
  x=f(x);y=f(y);z=f(z);
  return [116*y-16,500*(x-y),200*(y-z)];
}
function deltaE(a,b){
  const dl=a[0]-b[0],da=a[1]-b[1],db=a[2]-b[2];
  return Math.sqrt(dl*dl+da*da+db*db);
}

// Returns the closest English colour name, or null when the hex is unusable.
function matchColourName(hex){
  const rgb=hexToRgb(hex);
  if(!rgb)return null;
  const lab=rgbToLab(rgb);
  let best=null,bestD=Infinity;
  for(const [name,h] of COLOUR_LIBRARY){
    const d=deltaE(lab,rgbToLab(hexToRgb(h)));
    if(d<bestD){bestD=d;best=name;}
  }
  return best;
}

let DATA={categories:[],products:[],meta:null};
let SEL_CAT=null;

// ---------- Sign in ----------
$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  try{
    await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});
    await load();
  }catch(err){$('loginMsg').textContent=err.message;$('loginMsg').classList.remove('hidden')}
});
$('logout').addEventListener('click',async e=>{
  e.preventDefault();
  try{await fetch('/api/admin/logout',{method:'POST'})}catch{}
  location.reload();
});

// ---------- Load ----------
async function load(){
  try{
    const r=await fetch('/api/admin/showcase');
    if(r.status===401){$('loginView').classList.remove('hidden');$('editorView').classList.add('hidden');return}
    DATA=await r.json();
    $('loginView').classList.add('hidden');$('editorView').classList.remove('hidden');
    renderCats();renderProds();renderMeta();fillCatSelect();
  }catch(err){showMsg('Failed to load: '+err.message,'err')}
}
$('reload').addEventListener('click',load);

// ---------- Categories ----------
$('addCat').addEventListener('click',async()=>{
  const name=$('newCatName').value.trim(),id=$('newCatId').value.trim()||name.toLowerCase().replace(/[^a-z0-9]+/g,'-');
  if(!name)return showMsg('Please enter a category name','err');
  try{
    await api('/api/admin/showcase',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op:'addCategory',id,name})});
    $('newCatName').value='';$('newCatId').value='';
    await load();showMsg('Category added','ok');
  }catch(err){showMsg(err.message,'err')}
});

function renderCats(){
  const el=$('catList');
  if(!DATA.categories.length){el.innerHTML='<p class="hint">No categories yet — add one first.</p>';return}
  el.innerHTML=DATA.categories.map(c=>{
    const n=DATA.products.filter(p=>p.categoryId===c.id).length;
    return '<div class="list-row"><div><b>'+esc(c.name)+'</b><br><span class="hint">id: '+esc(c.id)+' · '+n+' products</span></div>'
      +'<div class="row" style="gap:6px">'
      +'<button class="secondary small" data-rename="'+esc(c.id)+'">Rename</button>'
      +'<button class="secondary small" data-delcat="'+esc(c.id)+'">Delete</button>'
      +'</div></div>';
  }).join('');
  el.querySelectorAll('[data-rename]').forEach(b=>b.addEventListener('click',async()=>{
    const id=b.dataset.rename,cur=DATA.categories.find(c=>c.id===id);
    const nn=prompt('New category name',cur.name);if(nn==null)return;
    try{await api('/api/admin/showcase',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op:'updateCategory',id,name:nn.trim()})});await load();showMsg('Renamed','ok')}catch(e){showMsg(e.message,'err')}
  }));
  el.querySelectorAll('[data-delcat]').forEach(b=>b.addEventListener('click',async()=>{
    const id=b.dataset.delcat,cur=DATA.categories.find(c=>c.id===id);
    if(!confirm('Delete category "'+cur.name+'"? Its '+DATA.products.filter(p=>p.categoryId===id).length+' product(s) will be deleted too.'))return;
    try{await api('/api/admin/showcase',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op:'deleteCategory',id})});await load();showMsg('Deleted','ok')}catch(e){showMsg(e.message,'err')}
  }));
}

// ---------- Product list ----------
function fillCatSelect(){
  const s=$('pcat');const v=s.value;
  s.innerHTML='<option value="">All categories</option>'+DATA.categories.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join('');
  s.value=v;
}
$('pcat').addEventListener('change',renderProds);
$('psearch').addEventListener('input',renderProds);

function renderProds(){
  const q=$('psearch').value.trim().toLowerCase(),cf=$('pcat').value;
  const list=DATA.products.filter(p=>{
    if(cf&&p.categoryId!==cf)return false;
    if(q){const hay=(p.name+' '+(p.sku||'')+' '+(p.id||'')).toLowerCase();if(!hay.includes(q))return false}
    return true;
  });
  const el=$('prodList');
  if(!list.length){el.innerHTML='<p class="hint">No matching products.</p>';return}
  el.innerHTML=list.map(p=>{
    const cat=DATA.categories.find(c=>c.id===p.categoryId);
    const price=(p.pricing&&p.pricing.length)?(p.pricing[0].price+(p.currency||'$')):'—';
    const img=p.image?'<img class="thumb" src="'+esc(p.image)+'" alt="">':'<div class="thumb"></div>';
    return '<div class="list-row">'+img
      +'<div><b>'+esc(p.name)+'</b><br><span class="hint">'+esc(p.sku||'No SKU')+' · '+esc(cat?cat.name:'Uncategorised')+' · from '+esc(price)+' · '+((p.colors||[]).length)+' colours</span></div>'
      +'<div class="row" style="gap:6px"><button class="small" data-edit="'+esc(p.id)+'">Edit</button>'
      +'<button class="secondary small" data-del="'+esc(p.id)+'">Delete</button></div></div>';
  }).join('');
  el.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openEditor(b.dataset.edit)));
  el.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',async()=>{
    const p=DATA.products.find(x=>x.id===b.dataset.del);
    if(!confirm('Delete product "'+p.name+'"?'))return;
    try{await api('/api/admin/showcase',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op:'deleteProduct',id:p.id})});await load();showMsg('Deleted','ok')}catch(e){showMsg(e.message,'err')}
  }));
}
$('addProd').addEventListener('click',()=>{
  if(!DATA.categories.length)return showMsg('Create a category first','err');
  openEditor(null);
});

// ---------- Product editor panel ----------
function openEditor(id){
  const p=id?DATA.products.find(x=>x.id===id):{
    id:'cy-'+Date.now().toString(36),categoryId:(SEL_CAT||DATA.categories[0].id),sku:'',name:'',
    description:'',features:[],materials:'',image:'',gallery:[],colors:[],sizes:[],sizeChart:[],
    pricing:[{quantity:300,price:''}],priceIncludes:'',priceNotes:[],currency:'$',
    spec:'',moq:null,leadTime:null
  };
  const d=document.createElement('div');
  d.className='card';
  d.style.borderTop='3px solid var(--orange)';
  d.style.scrollMarginTop='80px';
  d.id='productEditor';
  d.innerHTML=''
    +'<h2>'+(id?'Edit product':'Add product')+'</h2>'
    +'<div class="grid2">'
    +'<div class="field"><label>Product name *</label><input id="e_name" value="'+esc(p.name)+'"></div>'
    +'<div class="field"><label>SKU / item number</label><input id="e_sku" value="'+esc(p.sku||'')+'"></div>'
    +'<div class="field"><label>Category *</label><select id="e_cat">'+DATA.categories.map(c=>'<option value="'+esc(c.id)+'"'+(c.id===p.categoryId?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></div>'
    +'<div class="field"><label>Product id (unique)</label><input id="e_id" value="'+esc(p.id)+'"'+(id?' readonly':'')+'></div>'
    +'</div>'
    +'<div class="field"><label>Description</label><textarea id="e_desc">'+esc(p.description||'')+'</textarea></div>'
    +'<div class="field"><label>Features (one per line)</label><textarea id="e_features">'+esc((p.features||[]).join('\n'))+'</textarea></div>'
    +'<div class="field"><label>Materials</label><input id="e_materials" value="'+esc(p.materials||'')+'"></div>'
    +'<div class="field"><label>Specification</label><input id="e_spec" value="'+esc(p.spec||'')+'"></div>'
    +'<div class="grid2">'
    +'<div class="field"><label>MOQ (units)</label><input id="e_moq" type="number" min="0" value="'+(p.moq!=null?p.moq:'')+'"></div>'
    +'<div class="field"><label>Lead time (days)</label><input id="e_lead" type="number" min="0" value="'+(p.leadTime!=null?p.leadTime:'')+'"></div>'
    +'</div>'
    +'<div class="preview"><div class="preview-head">Images</div>'
    +'<div class="img-upload" id="e_upload">Click to upload images (multiple allowed)</div>'
    +'<input type="file" id="e_file" accept="image/*" multiple class="hidden">'
    +'<div class="img-hint">Click a photo to make it the main image. The first one marked <strong>MAIN</strong> is shown on the card.</div>'
    +'<div class="img-grid" id="e_imgs"></div>'
    +'<div class="field" style="margin-top:10px"><label>Main image URL</label><input id="e_image" value="'+esc(p.image||'')+'"></div>'
    +'<div class="field"><label>Gallery URLs (one per line)</label><textarea id="e_gallery">'+esc((p.gallery||[]).join('\n'))+'</textarea></div>'
    +'</div>'
    +'<div class="preview"><div class="preview-head">Colour swatches</div>'
    +'<div class="hint" style="margin-bottom:8px">Pick a colour and the closest English colour name is filled in automatically — you can rename it. '
    +'Use <strong>Pick</strong> to point a colour at one of this product\'s photos.</div>'
    +'<div id="e_colors"></div>'
    +'<button class="ghost small" id="e_addcolor" type="button">+ Add colour</button></div>'
    +'<div class="preview"><div class="preview-head">Sizes</div>'
    +'<div id="e_sizes" class="row" style="margin-bottom:8px"></div>'
    +'<button class="ghost small" id="e_addsize" type="button">+ Add size</button></div>'
    +'<div class="preview"><div class="preview-head">Size Chart</div>'
    +'<div class="hint" style="margin-bottom:8px">Upload one or more size chart images. Customers see a <strong>Size Chart</strong> link next to the sizes on the product card, which opens these images.</div>'
    +'<div class="img-upload" id="e_sc_upload">Click to upload size chart images (multiple allowed)</div>'
    +'<input type="file" id="e_sc_file" accept="image/*" multiple class="hidden">'
    +'<div id="e_sc_preview" style="margin-top:10px"></div>'
    +'<div class="field" style="margin-top:10px"><label>Size chart image URLs (one per line)</label><textarea id="e_sc_url">'+esc((p.sizeChart||[]).join('\n'))+'</textarea></div>'
    +'</div>'
    +'<div class="preview"><div class="preview-head">Tiered pricing</div><div id="e_pricing"></div>'
    +'<button class="ghost small" id="e_addprice" type="button">+ Add price tier</button></div>'
    +'<div class="grid2">'
    +'<div class="field"><label>Price includes (decoration)</label><input id="e_pi" value="'+esc(p.priceIncludes||'')+'"></div>'
    +'<div class="field"><label>Currency</label><select id="e_cur"><option value="$">$</option><option value="¥">¥</option><option value="€">€</option></select></div>'
    +'</div>'
    +'<div class="field"><label>Price notes (one per line)</label><textarea id="e_pn">'+esc((p.priceNotes||[]).join('\n'))+'</textarea></div>'
    +'<div class="sticky-save"><div class="row end" style="padding-bottom:4px">'
    +'<button class="secondary" id="e_cancel">Cancel</button>'
    +'<button id="e_save">Save product</button>'
    +'</div></div>';

  $('editorView').insertBefore(d,$('editorView').firstChild);
  d.scrollIntoView({behavior:'smooth',block:'start'});

  $('e_cur').value=p.currency||'$';
  // Deep copy: a shallow copy would share the colour objects with DATA.products,
  // so editing here would leak into the list even when the user hits Cancel.
  const clone=v=>JSON.parse(JSON.stringify(v==null?[]:v));
  const state={colors:clone(p.colors),sizes:clone(p.sizes),pricing:clone(p.pricing),
               gallery:clone(p.gallery),sizeChart:Array.isArray(p.sizeChart)?clone(p.sizeChart):(p.sizeChart?[String(p.sizeChart)]:[])};

  function drawColors(){
    $('e_colors').innerHTML=state.colors.map((c,i)=>
      '<div class="row" style="margin-bottom:6px">'
      +'<input type="color" value="'+esc(c.hex||'#cccccc')+'" data-cidx="'+i+'" data-cfield="hex" title="'+esc(c.hex||'Pick a colour')+'" style="width:44px;padding:3px;flex:0 0 auto">'
      +'<input value="'+esc(c.name||'')+'" placeholder="Colour name (auto-filled on pick)" data-cidx="'+i+'" data-cfield="name" style="flex:1">'
      +'<input value="'+esc(c.image||'')+'" placeholder="Image URL for this colour" data-cidx="'+i+'" data-cfield="image" style="flex:1.4">'
      +'<button class="ghost small" type="button" data-cpick="'+i+'" title="Pick from this product\'s images">Pick</button>'
      +'<button class="secondary small" type="button" data-cdel="'+i+'">✕</button></div>').join('')
      ||'<p class="hint">No colours yet.</p>';
    $('e_colors').querySelectorAll('[data-cidx]').forEach(inp=>inp.addEventListener('input',()=>{
      const i=+inp.dataset.cidx,f=inp.dataset.cfield;
      state.colors[i][f]=inp.value;
      // Picking a colour fills in the closest English name. A name the user
      // typed themselves is never overwritten.
      if(f==='hex'&&!state.colors[i].namedManually){
        const nm=matchColourName(inp.value);
        if(nm&&nm!==state.colors[i].name){
          state.colors[i].name=nm;
          const nameInput=$('e_colors').querySelector('[data-cidx="'+i+'"][data-cfield="name"]');
          if(nameInput)nameInput.value=nm;
        }
      }
    }));
    // Mark a name as user-entered so auto-matching stops overwriting it.
    $('e_colors').querySelectorAll('[data-cfield=name]').forEach(inp=>inp.addEventListener('input',()=>{
      state.colors[+inp.dataset.cidx].namedManually=true;
    }));
    $('e_colors').querySelectorAll('[data-cdel]').forEach(b=>b.addEventListener('click',()=>{
      state.colors.splice(+b.dataset.cdel,1);drawColors();
    }));
    // Pick a photo from this product's own images as the colour's image.
    $('e_colors').querySelectorAll('[data-cpick]').forEach(b=>b.addEventListener('click',()=>{
      const i=+b.dataset.cpick;
      const pool=[];
      if($('e_image').value)pool.push($('e_image').value);
      state.gallery.forEach(u=>{if(u&&!pool.includes(u))pool.push(u)});
      if(!pool.length)return showMsg('Upload images for this product first','err');
      const picker=document.createElement('div');
      picker.className='card';
      picker.style.cssText='position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);padding:40px;overflow:auto';
      picker.innerHTML='<div style="max-width:900px;margin:0 auto;background:#fff;border-radius:12px;padding:18px">'
        +'<h2 style="margin:0 0 12px">Pick a photo for “'+(state.colors[i].name||'colour')+'”</h2>'
        +'<div class="img-grid">'+pool.map(u=>'<img src="'+esc(u)+'" data-pick="'+esc(u)+'" style="width:96px;height:96px;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid var(--line)">').join('')+'</div>'
        +'<div style="margin-top:14px;text-align:right"><button class="secondary" type="button" id="pickCancel">Cancel</button></div></div>';
      document.body.appendChild(picker);
      picker.querySelectorAll('[data-pick]').forEach(img=>img.addEventListener('click',()=>{
        state.colors[i].image=img.dataset.pick;
        picker.remove();
        drawColors();
      }));
      picker.querySelector('#pickCancel').addEventListener('click',()=>picker.remove());
    }));
  }
  function drawSizes(){
    $('e_sizes').innerHTML=state.sizes.map((s,i)=>
      '<span class="tag">'+esc(s)+'<button data-sdel="'+i+'">×</button></span>').join('')
      ||'<span class="hint">No sizes yet.</span>';
    $('e_sizes').querySelectorAll('[data-sdel]').forEach(b=>b.addEventListener('click',()=>{
      state.sizes.splice(+b.dataset.sdel,1);drawSizes();
    }));
  }
  function drawPricing(){
    $('e_pricing').innerHTML=state.pricing.map((t,i)=>
      '<div class="row" style="margin-bottom:6px">'
      +'<input value="'+esc(t.quantity)+'" placeholder="Quantity" data-pidx="'+i+'" data-pfield="quantity" style="width:110px">'
      +'<input value="'+esc(t.price)+'" placeholder="Unit price" data-pidx="'+i+'" data-pfield="price" style="width:110px">'
      +'<button class="secondary small" data-pdel="'+i+'">✕</button></div>').join('')
      ||'<p class="hint">No price tiers yet.</p>';
    $('e_pricing').querySelectorAll('[data-pidx]').forEach(inp=>inp.addEventListener('input',()=>{
      const i=+inp.dataset.pidx,f=inp.dataset.pfield;
      state.pricing[i][f]=f==='price'?(parseFloat(inp.value)||0):(parseInt(inp.value)||0);
    }));
    $('e_pricing').querySelectorAll('[data-pdel]').forEach(b=>b.addEventListener('click',()=>{
      state.pricing.splice(+b.dataset.pdel,1);drawPricing();
    }));
  }
  function drawImgs(){
    // The main image is always the first entry of the gallery list, so the
    // grid order is the display order on the front end.
    const list=[];
    if($('e_image').value)list.push($('e_image').value);
    state.gallery.forEach(u=>{if(u&&!list.includes(u))list.push(u)});
    state.gallery=list;
    $('e_imgs').innerHTML=list.map((u,i)=>
      '<div class="img-tile'+(i===0?' main':'')+'" data-main="'+esc(u)+'">'
      +'<img src="'+esc(u)+'" alt="">'
      +(i===0?'<span class="badge">MAIN</span>':'')
      +'<button class="del" type="button" data-del="'+esc(u)+'" title="Remove">&times;</button>'
      +'</div>').join('');
    $('e_imgs').querySelectorAll('[data-main]').forEach(t=>{
      t.addEventListener('click',e=>{
        if(e.target.dataset.del)return;
        const u=t.dataset.main;
        $('e_image').value=u;
        state.gallery=[u,...state.gallery.filter(x=>x!==u)];
        $('e_gallery').value=state.gallery.join('\n');
        drawImgs();
      });
    });
    $('e_imgs').querySelectorAll('[data-del]').forEach(b=>{
      b.addEventListener('click',e=>{
        e.stopPropagation();
        const u=b.dataset.del;
        state.gallery=state.gallery.filter(x=>x!==u);
        if($('e_image').value===u)$('e_image').value=state.gallery[0]||'';
        $('e_gallery').value=state.gallery.join('\n');
        drawImgs();
      });
    });
  }
  drawColors();drawSizes();drawPricing();drawImgs();
  $('e_image').addEventListener('input',drawImgs);
  $('e_gallery').addEventListener('input',()=>{state.gallery=$('e_gallery').value.split('\n').map(s=>s.trim()).filter(Boolean);drawImgs()});

  // hex stays empty until a colour is actually picked, so an untouched row
  // is not written to the database.
  $('e_addcolor').addEventListener('click',()=>{state.colors.push({name:'',hex:'',image:''});drawColors();});
  $('e_addsize').addEventListener('click',()=>{
    const v=prompt('Size','One Size');if(v)state.sizes.push(v.trim());drawSizes();
  });

  // Size charts: one or more images, kept separate from the gallery so they
  // never become the card's main image.
  function drawSizeChart(){
    const box=$('e_sc_preview');
    if(!state.sizeChart.length){box.innerHTML='';return;}
    box.innerHTML='<div class="img-grid">'+state.sizeChart.map((u,i)=>
      '<div style="position:relative">'
      +'<img src="'+esc(u)+'" alt="Size chart '+(i+1)+'">'
      +'<button class="secondary small" type="button" data-sc-del="'+i+'" title="Remove" '
      +'style="position:absolute;top:3px;right:3px;padding:1px 6px;line-height:1.3;border-radius:6px">✕</button>'
      +'</div>').join('')+'</div>'
      +'<button class="secondary small" type="button" id="e_sc_clear" style="margin-top:8px">Remove all size charts</button>';
    box.querySelectorAll('[data-sc-del]').forEach(btn=>btn.addEventListener('click',()=>{
      state.sizeChart.splice(+btn.dataset.scDel,1);
      $('e_sc_url').value=state.sizeChart.join('\n');
      drawSizeChart();
    }));
    $('e_sc_clear').addEventListener('click',()=>{
      state.sizeChart=[];$('e_sc_url').value='';drawSizeChart();
    });
  }
  drawSizeChart();
  $('e_sc_upload').addEventListener('click',()=>$('e_sc_file').click());
  $('e_sc_file').addEventListener('change',async()=>{
    const files=Array.from($('e_sc_file').files||[]);
    if(!files.length)return;
    const fd=new FormData();
    files.forEach(f=>fd.append('file',f));
    fd.append('categoryId',$('e_cat').value);
    $('e_sc_upload').textContent='Uploading…';
    try{
      const res=await api('/api/admin/showcase/upload',{method:'POST',body:fd});
      const urls=res.urls||(res.url?[res.url]:[]);
      if(!urls.length)throw new Error('no url returned');
      urls.forEach(u=>{if(u&&!state.sizeChart.includes(u))state.sizeChart.push(u)});
      $('e_sc_url').value=state.sizeChart.join('\n');
      drawSizeChart();
      showMsg('Uploaded '+urls.length+' size chart image(s)','ok');
    }catch(err){showMsg('Size chart upload failed: '+err.message,'err')}
    $('e_sc_upload').textContent='Click to upload size chart images (multiple allowed)';
    $('e_sc_file').value='';
  });
  $('e_sc_url').addEventListener('input',()=>{
    state.sizeChart=$('e_sc_url').value.split('\n').map(s=>s.trim()).filter(Boolean);
    drawSizeChart();
  });
  $('e_addprice').addEventListener('click',()=>{state.pricing.push({quantity:'',price:''});drawPricing()});

  // Image upload
  $('e_upload').addEventListener('click',()=>$('e_file').click());
  $('e_file').addEventListener('change',async()=>{
    const files=Array.from($('e_file').files||[]);
    if(!files.length)return;
    const fd=new FormData();
    files.forEach(f=>fd.append('file',f));
    fd.append('categoryId',$('e_cat').value);
    $('e_upload').textContent='Uploading…';
    try{
      const res=await api('/api/admin/showcase/upload',{method:'POST',body:fd});
      const urls=res.urls||[res.url];
      if(!$('e_image').value&&urls[0]){$('e_image').value=urls[0];}
      else urls.forEach(u=>{if(!state.gallery.includes(u))state.gallery.push(u)});
      $('e_gallery').value=state.gallery.join('\n');
      drawImgs();
      showMsg('Uploaded '+urls.length+' image(s)','ok');
    }catch(err){showMsg('Upload failed: '+err.message,'err')}
    $('e_upload').textContent='Click to upload images (multiple allowed)';
    $('e_file').value='';
  });

  $('e_cancel').addEventListener('click',()=>d.remove());
  $('e_save').addEventListener('click',async()=>{
    const name=$('e_name').value.trim();
    if(!name)return showMsg('Please enter a product name','err');
    const prod={
      id:$('e_id').value.trim(),categoryId:$('e_cat').value,name,sku:$('e_sku').value.trim(),
      description:$('e_desc').value.trim(),
      features:$('e_features').value.split('\n').map(s=>s.trim()).filter(Boolean),
      materials:$('e_materials').value.trim(),
      image:$('e_image').value.trim(),
      gallery:state.gallery,
      // Keep every row that carries a colour value — a swatch without a name
      // is still a valid swatch.
      colors:state.colors.filter(c=>c.hex||c.name||c.image).map(c=>({
        name:c.name||'',hex:c.hex||'',image:c.image||'',
      })),
      sizes:state.sizes,
      sizeChart:state.sizeChart,
      pricing:state.pricing.filter(t=>t.quantity!==''&&t.price!==''),
      priceIncludes:$('e_pi').value.trim(),
      priceNotes:$('e_pn').value.split('\n').map(s=>s.trim()).filter(Boolean),
      currency:$('e_cur').value,
      spec:$('e_spec').value.trim(),
      moq:$('e_moq').value===''?null:Number($('e_moq').value),
      leadTime:$('e_lead').value===''?null:Number($('e_lead').value),
    };
    try{
      await api('/api/admin/showcase',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op:'saveProduct',product:prod})});
      await load();d.remove();showMsg('Product saved','ok');
    }catch(err){
      // Keep the editor open so the edits are not lost, and say what failed.
      showMsg('Save failed: '+err.message,'err');
    }
  });
}

// ---------- Page info ----------
function renderMeta(){
  const m=DATA.meta||{title:'SHOWCASE',subtitle:'',projectName:'',date:'',recipients:[],jobs:[],disclaimer:''};
  $('m_title').value=m.title||'';
  $('m_subtitle').value=m.subtitle||'';
  $('m_projectName').value=m.projectName||'';
  $('m_date').value=m.date||'';
  $('m_recipients').value=(m.recipients||[]).map(r=>[r.name,r.email].filter(Boolean).join(', ')).join('\n');
  $('m_jobs').value=(m.jobs||[]).map(j=>[j.label,j.value].filter(Boolean).join(', ')).join('\n');
  $('m_disclaimer').value=m.disclaimer||'';
}
$('saveMeta').addEventListener('click',async()=>{
  const meta={
    title:$('m_title').value.trim(),subtitle:$('m_subtitle').value.trim(),
    projectName:$('m_projectName').value.trim(),date:$('m_date').value.trim(),
    recipients:$('m_recipients').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
      const[nm,em]=l.split(/[,，]/).map(s=>s.trim());return{name:nm,email:em||''};
    }),
    jobs:$('m_jobs').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
      const[lb,vl]=l.split(/[,，]/).map(s=>s.trim());return{label:lb,value:vl||''};
    }),
    disclaimer:$('m_disclaimer').value.trim(),
  };
  try{await api('/api/admin/showcase',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op:'saveMeta',meta})});await load();showMsg('Page info saved','ok')}catch(e){showMsg(e.message,'err')}
});

// ---------- Tabs ----------
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  ['categories','products','meta'].forEach(t=>{
    $('tab-'+t).classList.toggle('hidden',t!==b.dataset.tab);
  });
}));

// Check for an existing session
load();
</script>
