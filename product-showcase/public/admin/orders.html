<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Orders | Cyndi Global</title>
<style>
:root{--navy:#0f1f3a;--blue:#1e5a8a;--sky:#eef6fb;--text:#1a2a3a;--muted:#71849a;--line:#dce8f0;--orange:#e07a3a}
*{box-sizing:border-box}body{margin:0;background:var(--sky);color:var(--text);font-family:Arial,sans-serif}
header{padding:16px 5%;background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center}
header a{color:#cfe0ee;text-decoration:none;font-size:14px}header a.on{color:#fff;font-weight:700}
main{max-width:1200px;margin:24px auto;padding:0 16px}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 8px 24px #0f1f3a12;margin-bottom:16px}
.field{margin-bottom:12px}label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px}
button{border:0;border-radius:8px;padding:9px 14px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer;font-size:13px}
button.secondary{background:#fff;color:var(--navy);border:1px solid var(--line)}
button.small{padding:5px 9px;font-size:12px}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,a:focus-visible,tr:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.msg{margin-top:10px;padding:10px;border-radius:8px;background:#e0f0f8;color:#176080;font-size:13px}
.msg.err{background:#fff1eb;color:#9a3d22}.hidden{display:none!important}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar input{width:auto;flex:1;min-width:200px}.toolbar select{width:auto}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tabs button{border-radius:0;background:#fff;color:var(--navy);font-weight:600;padding:8px 14px}
.tabs button[aria-pressed="true"]{background:var(--navy);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
#rows tr{cursor:pointer}#rows tr:hover{background:#f7fafc}#rows tr.sel{background:#eef6fb}
.sub{color:var(--muted);font-size:11px}
code{font-size:12px}
.pill{display:inline-block;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:700;background:#eef1f4;color:#45566a;white-space:nowrap}
.pill.type{background:#eef6fb;color:var(--blue)}
.st-pending{background:#fff4e0;color:#8a5a00}.st-processing{background:#e6efff;color:#1d4f9a}
.st-shipped{background:#efe8ff;color:#5b3aa6}.st-in_transit{background:#e3f4f7;color:#17707f}
.st-delivered{background:#e8f8ef;color:#217753}.st-cancelled{background:#f1e3e3;color:#9a3d22}
.pager{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:16px;flex-wrap:wrap}
.pager .pageinfo{color:var(--muted);font-size:12px;margin:0 6px}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* Detail drawer */
.overlay{position:fixed;inset:0;background:#0f1f3a55;z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:#fff;z-index:21;overflow:auto;box-shadow:-12px 0 32px #0f1f3a30;padding:22px}
.drawer h2{margin:0;font-size:20px;color:var(--navy)}
.drawer h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;font-size:13px}
.dl dt{font-size:11px;color:var(--muted)}.dl dd{margin:0;font-weight:600;word-break:break-word}
.notes{white-space:pre-wrap;word-break:break-word;background:#f7fafc;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px}
.items td{vertical-align:top}
.thumb{width:48px;height:48px;object-fit:contain;background:#f2efe9;border-radius:6px;display:block}
.thumb.ph{display:block}
.status-box{background:#f7fafc;border:1px solid var(--line);border-radius:10px;padding:14px}
.status-box select{width:auto;min-width:180px}
.totals{display:flex;justify-content:flex-end;gap:24px;margin-top:10px;font-size:13px}
.totals strong{font-size:15px}
/* Shipments (order-attached tracking). Shipment statuses use their own .sst-* pills. */
textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;resize:vertical}
textarea:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.ship-card{border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px;background:#fff}
.ship-card h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 6px}
.ship-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px;margin-top:10px}
.ship-grid .full{grid-column:1/-1}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 12px 8px}
.tl li::before{content:'';position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--line)}
.tl li:first-child::before{background:var(--orange)}
.tl li:first-child .tl-title{color:var(--orange)}
.tl-title{font-weight:700;font-size:13px;margin-top:2px;word-break:break-word}
.tl-desc{white-space:pre-wrap;font-size:13px;word-break:break-word}
.photos{display:grid;grid-template-columns:repeat(auto-fill,96px);gap:10px}
.photos figure{margin:0;font-size:11px}
.photos img{width:96px;height:96px;object-fit:cover;border-radius:6px;background:#f2efe9;display:block}
.photos figcaption{color:var(--muted);margin:4px 0;word-break:break-word}
.sst-pending{background:#fff4e0;color:#8a5a00}.sst-shipped{background:#efe8ff;color:#5b3aa6}
.sst-in_transit{background:#e3f4f7;color:#17707f}.sst-customs{background:#fdf0e6;color:#9a4f17}
.sst-out_for_delivery{background:#e6efff;color:#1d4f9a}.sst-delivered{background:#e8f8ef;color:#217753}
.sst-exception{background:#f1e3e3;color:#9a3d22}
/* Detail tabs (Order / Shipments) and the shipment list -> editor drill-down */
.dtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:16px}
.dtabs button{border-radius:8px 8px 0 0;background:#fff;color:var(--muted);font-weight:700;padding:9px 16px;border:1px solid transparent;border-bottom:0;margin-bottom:-1px}
.dtabs button[aria-selected="true"]{color:var(--navy);border-color:var(--line);background:#fff;box-shadow:inset 0 3px 0 var(--orange)}
.dtabs .count{display:inline-block;min-width:18px;margin-left:6px;padding:1px 6px;border-radius:9px;background:#eef1f4;color:#45566a;font-size:11px;text-align:center}
.ship-list tbody tr{cursor:pointer}.ship-list tbody tr:hover{background:#f7fafc}
.ship-list tr:focus-visible{outline:2px solid var(--orange);outline-offset:-2px}
@media(max-width:820px){.hide-sm{display:none}.dl{grid-template-columns:1fr}.ship-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <strong>CYNDI GLOBAL — ADMIN</strong>
  <nav class="row" style="gap:16px;align-items:center" aria-label="Admin" data-admin-auth-slot>
    <a href="/admin/">Home</a>
    <a href="/admin/products.html">Products</a>
    <a href="/admin/orders.html" class="on" aria-current="page">Orders</a>
    <a href="/admin/customers.html">Customers</a>
    <a href="/admin/showcase.html">Showcase</a>
    <a href="/admin/inventory.html">Inventory</a>
    <a href="/admin/logistics.html">Shipping</a>
  </nav>
</header>
<main>
  <!-- Orders -->
  <section id="editorView" class="hidden">
    <div class="card">
      <div class="toolbar">
        <div class="tabs" role="group" aria-label="Order type">
          <button type="button" data-type="all" aria-pressed="true">All</button>
          <button type="button" data-type="SW" aria-pressed="false">Shop (SW)</button>
          <button type="button" data-type="SC" aria-pressed="false">Showcase</button>
        </div>
        <label for="statusFilter" class="hidden">Status</label>
        <select id="statusFilter" aria-label="Filter by status"><option value="">All statuses</option></select>
        <input id="search" type="search" placeholder="Search order no / name / email / company…" aria-label="Search orders">
        <button class="secondary small" id="reload" type="button">Refresh</button>
        <span id="count" style="color:var(--muted);font-size:12px" aria-live="polite"></span>
      </div>
      <div id="msg" class="msg hidden" role="status"></div>
      <table>
        <thead><tr>
          <th scope="col">Order no</th><th scope="col">Type</th><th scope="col" class="hide-sm">Created</th>
          <th scope="col">Customer / company</th><th scope="col" class="num">Items</th><th scope="col" class="num">Total</th><th scope="col">Status</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="pager" class="pager"></div>
    </div>
  </section>
</main>

<div id="overlay" class="overlay hidden"></div>
<aside id="drawer" class="drawer hidden" role="dialog" aria-modal="true" aria-labelledby="dTitle" tabindex="-1">
  <div class="row" style="justify-content:space-between">
    <div>
      <h2 id="dTitle"></h2>
      <div id="dSub" class="sub" style="margin-top:4px"></div>
    </div>
    <button type="button" class="secondary small" id="dClose">Close</button>
  </div>
  <div id="dMsg" class="msg hidden" role="status"></div>
  <div id="dBody"></div>
</aside>

<script src="/admin/admin-auth.js"></script>
<script>
// All order data is customer-supplied: it is only ever rendered via textContent /
// DOM properties (never innerHTML), image URLs are restricted to http(s) and
// mailto links are built from encoded values.
const API = '../api/admin/orders';
const PAGE_SIZE = 25;
const KNOWN = ['pending','processing','shipped','in_transit','delivered','cancelled'];
const LABELS = {pending:'Pending',processing:'Processing',shipped:'Shipped',in_transit:'In transit',delivered:'Delivered',cancelled:'Cancelled'};
const state = {type:'all', status:'', q:'', page:1, total:0, orders:[], counts:{}, openNo:null, lastFocus:null, detailTab:'order'};

function $(id){return document.getElementById(id)}
function show(el,text,err){el.textContent=text;el.className='msg'+(err?' err':'');el.classList.remove('hidden')}
function hide(el){el.classList.add('hidden')}
// Tiny DOM builder: children are nodes or strings (strings become text nodes).
function h(tag,props,...kids){
  const n=document.createElement(tag);
  if(props)for(const [k,v] of Object.entries(props)){
    if(v==null||v===false)continue;
    if(k==='class')n.className=v;
    else if(k==='text')n.textContent=v;
    else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);
    else n.setAttribute(k,String(v));
  }
  for(const c of kids.flat()){if(c==null||c===false)continue;n.appendChild(typeof c==='object'?c:document.createTextNode(String(c)))}
  return n;
}
function clear(n){while(n.firstChild)n.removeChild(n.firstChild)}

class AuthError extends Error{}
async function api(url,opts){
  const r=await fetch(url,Object.assign({credentials:'same-origin'},opts||{}));
  const b=await r.json().catch(()=>({}));
  if(r.status===401){showLogin();throw new AuthError('Please sign in again');}
  if(!r.ok){const e=new Error(b.error||'Request failed');e.status=r.status;e.body=b;throw e;}
  return b;
}

function label(s){return LABELS[s]||String(s||'—')}
function badge(s){return h('span',{class:'pill '+(KNOWN.includes(s)?'st-'+s:''),text:label(s)})}
function sym(c){if(!c)return '';if(c==='USD'||c==='$')return '$';if(c==='CNY'||c==='¥')return '¥';return String(c)+' '}
function money(v,c){const n=Number(v);return Number.isFinite(n)?sym(c)+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'—'}
function fmtDate(v){if(!v)return '—';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'})}
function safeImg(raw){
  if(typeof raw!=='string'||!raw.trim())return null;
  try{const u=new URL(raw.trim(),location.origin);return (u.protocol==='http:'||u.protocol==='https:')?u.href:null}catch{return null}
}
const EMAIL_RE=/^[^@\s<>"'()\\,;:]+@[^@\s<>"'()\\,;:]+\.[^@\s<>"'()\\,;:]+$/;

// 401 from a feature API -> shared login overlay (admin-auth.js)
function showLogin(){closeDrawer();AdminAuth.requireLogin()}
function showEditor(){$('editorView').classList.remove('hidden')}

// ---------- List ----------
async function load(){
  const p=new URLSearchParams({type:state.type,page:String(state.page),pageSize:String(PAGE_SIZE)});
  if(state.status)p.set('status',state.status);
  if(state.q)p.set('q',state.q);
  try{
    const b=await api(API+'?'+p.toString());
    showEditor();
    state.orders=b.orders||[];state.total=b.total||0;state.counts=b.statusCounts||{};
    const pages=Math.max(1,Math.ceil(state.total/PAGE_SIZE));
    if(state.page>pages&&state.total>0){state.page=pages;return load();}
    renderStatusFilter();renderRows();renderPager(pages);
    $('count').textContent=state.total+' order'+(state.total===1?'':'s');
  }catch(e){if(!(e instanceof AuthError))show($('msg'),e.message,true)}
}

function renderStatusFilter(){
  const sel=$('statusFilter');const cur=state.status;
  clear(sel);
  const all=Object.values(state.counts).reduce((a,n)=>a+(Number(n)||0),0);
  sel.appendChild(h('option',{value:'',text:'All statuses ('+all+')'}));
  const keys=[...KNOWN,...Object.keys(state.counts).filter(k=>!KNOWN.includes(k))];
  for(const k of keys)sel.appendChild(h('option',{value:k,text:label(k)+' ('+(state.counts[k]||0)+')'}));
  if(cur&&!keys.includes(cur))sel.appendChild(h('option',{value:cur,text:label(cur)+' (0)'}));
  sel.value=cur;
}

function renderRows(){
  const tb=$('rows');clear(tb);
  if(!state.orders.length){tb.appendChild(h('tr',null,h('td',{colspan:'7',class:'empty',text:'No orders match.'})));return;}
  for(const o of state.orders){
    const who=[o.customerName,o.company].filter(Boolean).join(' · ');
    const tr=h('tr',{tabindex:'0','data-no':o.orderNo,class:o.orderNo===state.openNo?'sel':null,'aria-label':'Open order '+o.orderNo},
      h('td',null,h('code',{text:o.orderNo})),
      h('td',null,h('span',{class:'pill type',text:o.type||'—'})),
      h('td',{class:'hide-sm'},fmtDate(o.createdAt)),
      h('td',null,h('div',{text:who||'—'}),h('div',{class:'sub',text:o.customerEmail||''})),
      h('td',{class:'num',text:String(o.itemCount??'—')}),
      h('td',{class:'num',text:money(o.total,o.currency)}),
      h('td',null,badge(o.status)));
    tr.addEventListener('click',()=>openOrder(o.orderNo,tr));
    tr.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openOrder(o.orderNo,tr)}});
    tb.appendChild(tr);
  }
}

function renderPager(pages){
  const el=$('pager');clear(el);
  if(pages<=1)return;
  el.appendChild(h('button',{type:'button',class:'secondary small',disabled:state.page<=1?'':null,onclick:()=>{state.page--;load()}},'‹ Prev'));
  el.appendChild(h('span',{class:'pageinfo',text:'Page '+state.page+' / '+pages}));
  el.appendChild(h('button',{type:'button',class:'secondary small',disabled:state.page>=pages?'':null,onclick:()=>{state.page++;load()}},'Next ›'));
}

// ---------- Detail ----------
async function openOrder(no,fromEl){
  if(state.openNo!==no){state.detailTab='order';ship.openId=null}
  state.openNo=no;state.lastFocus=fromEl||document.activeElement;
  document.querySelectorAll('#rows tr').forEach(r=>r.classList.toggle('sel',r.dataset.no===no));
  $('dTitle').textContent=no;$('dSub').textContent='Loading…';clear($('dBody'));hide($('dMsg'));
  $('overlay').classList.remove('hidden');$('drawer').classList.remove('hidden');$('drawer').focus();
  try{const b=await api(API+'?orderNo='+encodeURIComponent(no));renderDetail(b.order)}
  catch(e){if(!(e instanceof AuthError)){$('dSub').textContent='';show($('dMsg'),e.message,true)}}
}

function closeDrawer(){
  if($('drawer').classList.contains('hidden'))return;
  $('overlay').classList.add('hidden');$('drawer').classList.add('hidden');state.openNo=null;
  document.querySelectorAll('#rows tr.sel').forEach(r=>r.classList.remove('sel'));
  if(state.lastFocus&&document.contains(state.lastFocus))state.lastFocus.focus();
}

function dlItem(term,value){return [h('dt',{text:term}),h('dd',null,value==null||value===''?'—':value)]}

function emailNode(email){
  if(!email)return '—';
  if(!EMAIL_RE.test(email))return String(email);
  return h('a',{href:'mailto:'+encodeURIComponent(email),text:email});
}

function renderDetail(o){
  $('dTitle').textContent=o.orderNo;
  $('dSub').textContent=(o.type==='SC'?'Showcase order':o.type==='SW'?'Shop order':'Order')+' · created '+fmtDate(o.createdAt)+' · updated '+fmtDate(o.statusUpdatedAt);
  const root=$('dBody');clear(root);
  const c=o.contact||{};

  // Two tabs in the same drawer: "Order" (everything except tracking) and "Shipments".
  const orderPanel=h('div',{id:'dpanel-order',role:'tabpanel','aria-labelledby':'dtab-order',tabindex:'0'});
  const shipPanel=h('div',{id:'dpanel-ship',role:'tabpanel','aria-labelledby':'dtab-ship',tabindex:'0'});
  const tabOrder=h('button',{type:'button',role:'tab',id:'dtab-order','aria-controls':'dpanel-order'},'Order');
  const tabShip=h('button',{type:'button',role:'tab',id:'dtab-ship','aria-controls':'dpanel-ship'},'Shipments',
    h('span',{id:'shipCount',class:'count hidden','aria-hidden':'true'}));
  const tabs=[tabOrder,tabShip];
  const selectTab=(key,focus)=>{
    state.detailTab=key;
    tabs.forEach(t=>{const on=(t===tabShip)===(key==='ship');t.setAttribute('aria-selected',String(on));t.tabIndex=on?0:-1;if(on&&focus)t.focus()});
    orderPanel.classList.toggle('hidden',key==='ship');shipPanel.classList.toggle('hidden',key!=='ship');
    // Entering the Shipments tab always lands on the shipment list, not the last-open editor.
    if(key==='ship'&&ship.openId!=null){ship.openId=null;if(ship.data)renderShipments(ship.data)}
  };
  tabOrder.addEventListener('click',()=>selectTab('order'));
  tabShip.addEventListener('click',()=>selectTab('ship'));
  const tabKeys=e=>{
    let k=null;
    if(e.key==='ArrowRight'||e.key==='ArrowLeft')k=state.detailTab==='ship'?'order':'ship';
    else if(e.key==='Home')k='order';else if(e.key==='End')k='ship';
    if(k){e.preventDefault();selectTab(k,true)}
  };
  tabs.forEach(t=>t.addEventListener('keydown',tabKeys));
  root.appendChild(h('div',{class:'dtabs',role:'tablist','aria-label':'Order detail sections'},tabs));
  root.appendChild(orderPanel);root.appendChild(shipPanel);
  selectTab(state.detailTab==='ship'?'ship':'order');
  const body=orderPanel;

  // Status
  const box=h('div',{class:'status-box'});
  box.appendChild(h('div',{class:'row'},h('span',{class:'sub',text:'Current status'}),badge(o.status)));
  const next=Array.isArray(o.allowedNext)?o.allowedNext:[];
  if(!next.length){
    box.appendChild(h('p',{class:'sub',style:'margin:10px 0 0',text:'This is a final status and cannot be changed.'}));
  }else{
    const sel=h('select',{id:'nextStatus','aria-label':'New status'},h('option',{value:'',text:'Change status to…'}),
      next.map(s=>h('option',{value:s.value,text:s.label||label(s.value)})));
    const btn=h('button',{type:'button',disabled:''},'Update status');
    sel.addEventListener('change',()=>{btn.disabled=!sel.value});
    btn.addEventListener('click',()=>changeStatus(o,sel.value,btn));
    box.appendChild(h('div',{class:'row',style:'margin-top:10px'},h('label',{for:'nextStatus',class:'hidden',text:'New status'}),sel,btn));
  }
  body.appendChild(h('h3',{text:'Status'}));body.appendChild(box);

  // Shipments tab (loaded separately from /api/admin/shipments)
  shipPanel.appendChild(h('div',{id:'shipBox',style:'margin-top:16px'},h('p',{class:'sub',text:'Loading shipments…'})));
  loadShipments(o.orderNo);

  // Contact
  body.appendChild(h('h3',{text:'Contact'}));
  body.appendChild(h('dl',{class:'dl'},
    dlItem('Name',c.name),dlItem('Email',emailNode(c.email)),dlItem('Phone',c.phone),dlItem('Company',c.company),
    o.placedBy?dlItem('Placed by (showcase account)',o.placedBy):null));

  // Customer account (orders placed while signed in)
  if(o.customerId){
    const a=o.account;
    body.appendChild(h('h3',{text:'Customer account'}));
    body.appendChild(h('dl',{class:'dl'},
      dlItem('Account',a?h('a',{href:'/admin/customers.html',text:'#'+o.customerId}):'#'+o.customerId+' (deleted)'),
      a?dlItem('Login email',a.email):null,
      a?dlItem('Username',a.username):null,
      a?dlItem('Client',a.clientCode?(a.clientCode+(a.clientName&&a.clientName!==a.clientCode?' — '+a.clientName:'')):'—'):null,
      a&&a.status&&a.status!=='active'?dlItem('Account status',a.status):null));
  }

  if(o.notes){body.appendChild(h('h3',{text:'Notes'}));body.appendChild(h('div',{class:'notes',text:o.notes}))}

  // Items
  const items=Array.isArray(o.items)?o.items:[];
  body.appendChild(h('h3',{text:'Line items ('+items.length+')'}));
  const tbody=h('tbody');
  for(const it of items){
    if(!it||typeof it!=='object')continue;
    const qty=Number(it.quantity)||0;
    const unit=it.unitPrice!=null?it.unitPrice:it.price;
    const line=it.lineTotal!=null?it.lineTotal:(Number(unit)||0)*qty;
    const cur=it.currency||o.currency;
    const src=safeImg(it.image);
    const extra=[];
    if(it.moq!=null&&Number(it.moq)>1)extra.push('MOQ '+it.moq);
    if(it.leadTime!=null&&it.leadTime!=='')extra.push('Lead time '+it.leadTime+' days');
    tbody.appendChild(h('tr',null,
      h('td',null,src?h('img',{class:'thumb',src:src,alt:'',loading:'lazy',referrerpolicy:'no-referrer'}):h('span',{class:'thumb ph','aria-hidden':'true'})),
      h('td',null,h('div',{style:'font-weight:600',text:it.name||'—'}),
        h('div',{class:'sub',text:[it.sku,it.productId||it.id].filter(Boolean).join(' · ')}),
        extra.length?h('div',{class:'sub',text:extra.join(' · ')}):null),
      h('td',{text:it.colorName||it.selectedColor||'—'}),
      h('td',{text:it.size||it.selectedSize||'—'}),
      h('td',{class:'num',text:String(qty)}),
      h('td',{class:'num',text:money(unit,cur)}),
      h('td',{class:'num',text:money(line,cur)})));
  }
  body.appendChild(h('table',{class:'items'},
    h('thead',null,h('tr',null,h('th',{scope:'col'},h('span',{class:'hidden',text:'Image'})),h('th',{scope:'col',text:'Product'}),h('th',{scope:'col',text:'Colour'}),
      h('th',{scope:'col',text:'Size'}),h('th',{scope:'col',class:'num',text:'Qty'}),h('th',{scope:'col',class:'num',text:'Unit'}),h('th',{scope:'col',class:'num',text:'Line total'}))),
    tbody));
  body.appendChild(h('div',{class:'totals'},
    h('span',null,'Units: ',h('strong',{text:String(o.itemCount??'—')})),
    h('span',null,'Total: ',h('strong',{text:money(o.total,o.currency)}))));
}

async function changeStatus(o,to,btn){
  if(!to)return;
  const msg='Change '+o.orderNo+' from '+label(o.status)+' to '+label(to)+'?';
  if(!confirm(msg))return;
  if(to==='cancelled'&&!confirm('Cancelling is final: a cancelled order cannot be reopened. Cancel '+o.orderNo+'?'))return;
  btn.disabled=true;hide($('dMsg'));
  try{
    const b=await api(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderNo:o.orderNo,status:to,expectedStatus:o.status})});
    renderDetail(b.order);
    show($('dMsg'),o.orderNo+' is now '+label(b.order.status));
  }catch(e){
    if(e instanceof AuthError)return;
    show($('dMsg'),e.message,true);
    if(e.status===409&&e.body&&e.body.order)renderDetail(e.body.order);
    else btn.disabled=false;
  }
  load();
}

// ---------- Shipments ----------
// Shipment data is admin-entered but shown to customers too: rendered via h()/textContent only.
// Shipment status is separate from order status; nothing here changes the order.
const SHIP_API = '../api/admin/shipments';
const SHIP_UPLOAD = '../api/admin/shipments/upload';
const SHIP_KNOWN = ['pending','shipped','in_transit','customs','out_for_delivery','delivered','exception'];
const PHOTO_TYPES = ['image/jpeg','image/png','image/webp','image/gif'];
const ship = {data:null, openId:null}; // last GET response for the open order (statuses, limits, uploadEnabled, shipments); openId = shipment shown in the editor

function shipPill(code,lbl){return h('span',{class:'pill '+(SHIP_KNOWN.includes(code)?'sst-'+code:''),text:lbl||code||'—'})}
function toLocalInput(iso){
  if(!iso)return '';const d=new Date(iso);if(isNaN(d))return '';
  const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());
}
function fromLocalInput(v){if(!v)return '';const d=new Date(v);return isNaN(d)?'':d.toISOString()}
function shipField(id,lbl,input,full){return h('div',{class:'field'+(full?' full':'')},h('label',{for:id,text:lbl}),input)}

async function loadShipments(orderNo){
  try{
    const b=await api(SHIP_API+'?orderNo='+encodeURIComponent(orderNo));
    if(state.openNo!==orderNo)return; // drawer switched to another order meanwhile
    renderShipments(b);
  }catch(e){
    if(e instanceof AuthError||state.openNo!==orderNo)return;
    const box=$('shipBox');
    if(box){clear(box);box.appendChild(h('p',{class:'sub',text:'Could not load shipments: '+e.message}))}
  }
}

// Shipments tab is a drill-down: list of summary rows -> one shipment's editor (ship.openId).
// Every re-render comes from the latest ship.data: stay on the open shipment if it still
// exists, otherwise fall back to the list.
function renderShipments(d,focusId){
  ship.data=d;
  const box=$('shipBox');if(!box)return;
  const list=Array.isArray(d.shipments)?d.shipments:[];
  const cnt=$('shipCount');
  if(cnt){cnt.textContent=String(list.length);cnt.classList.toggle('hidden',!list.length)}
  const tab=$('dtab-ship');
  if(tab)tab.setAttribute('aria-label','Shipments ('+list.length+')');
  const open=ship.openId!=null?list.find(x=>x.id===ship.openId):null;
  if(open){
    const idx=list.indexOf(open);
    clear(box);box.appendChild(renderShipmentCard(d.orderNo,open,idx));
    if(focusId===open.id){const b=$('shipBack');if(b)b.focus()}
    return;
  }
  ship.openId=null;
  renderShipmentList(d,list,focusId);
}

function openShipment(sid){ship.openId=sid;hide($('dMsg'));renderShipments(ship.data,sid)}
function backToShipments(){const sid=ship.openId;ship.openId=null;hide($('dMsg'));renderShipments(ship.data,sid)}

function renderShipmentList(d,list,focusId){
  const box=$('shipBox');if(!box)return;
  clear(box);
  const cancelled=String(d.orderStatus).toLowerCase()==='cancelled';
  const full=list.length>=((d.limits&&d.limits.shipmentsPerOrder)||20);
  const addBtn=h('button',{type:'button',class:'small',disabled:(cancelled||full)?'':null,
    title:cancelled?'Cancelled orders cannot get new shipments':full?'Shipment limit reached':null},'Add shipment');
  box.appendChild(h('div',{class:'row',style:'justify-content:space-between'},
    h('span',{class:'sub',text:list.length?list.length+' shipment'+(list.length===1?'':'s'):'No shipments yet.'}),addBtn));
  const createSlot=h('div');
  box.appendChild(createSlot);
  addBtn.addEventListener('click',()=>{
    clear(createSlot);
    const form=shipmentForm('snew',{status:'pending'},d.statuses||[]);
    const save=h('button',{type:'button'},'Create shipment');
    const cancel=h('button',{type:'button',class:'secondary'},'Cancel');
    cancel.addEventListener('click',()=>clear(createSlot));
    save.addEventListener('click',()=>shipFullOp(Object.assign({op:'create'},form.read()),save,'Shipment created'));
    createSlot.appendChild(h('div',{class:'ship-card'},h('strong',{text:'New shipment'}),form.el,
      h('div',{class:'row',style:'margin-top:10px'},save,cancel)));
  });
  if(!list.length)return;
  const tbody=h('tbody');
  let focusRow=null;
  list.forEach((s,i)=>{
    const n=s.index||i+1;
    const ev=Array.isArray(s.events)?s.events.length:0;
    const ph=Array.isArray(s.photos)?s.photos.length:0;
    const tr=h('tr',{tabindex:'0','aria-label':'Edit shipment '+n},
      h('td',{text:String(n)}),
      h('td',{text:s.carrier||'—'}),
      h('td',null,s.trackingNo?h('code',{text:s.trackingNo}):'—'),
      h('td',null,shipPill(s.status,s.statusLabel)),
      h('td',{class:'num',text:String(ev)}),
      h('td',{class:'num',text:String(ph)}));
    tr.addEventListener('click',()=>openShipment(s.id));
    tr.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openShipment(s.id)}});
    if(focusId!=null&&s.id===focusId)focusRow=tr;
    tbody.appendChild(tr);
  });
  box.appendChild(h('table',{class:'ship-list',style:'margin-top:12px'},
    h('thead',null,h('tr',null,h('th',{scope:'col',text:'#'}),h('th',{scope:'col',text:'Carrier'}),h('th',{scope:'col',text:'Tracking no'}),
      h('th',{scope:'col',text:'Status'}),h('th',{scope:'col',class:'num',text:'Events'}),h('th',{scope:'col',class:'num',text:'Photos'}))),
    tbody));
  box.appendChild(h('p',{class:'sub',text:'Click a shipment to edit its details, timeline and photos.'}));
  if(focusRow)focusRow.focus();
}

// Editable shipment fields. Values are read from .value properties at submit time;
// textareas get their content via `text` and the current status via `selected` + sel.value,
// so a full-replace update never wipes notes or resets the status.
function shipmentForm(px,s,statuses){
  const id=k=>px+'-'+k;
  const inp=(k,type,extra)=>h('input',Object.assign({id:id(k),type:type},extra));
  const f={
    carrier:inp('carrier','text',{maxlength:'80',value:s.carrier||''}),
    trackingNo:inp('trackingNo','text',{maxlength:'80',value:s.trackingNo||''}),
    trackingUrl:inp('trackingUrl','url',{maxlength:'500',placeholder:'https://…',value:s.trackingUrl||''}),
    status:h('select',{id:id('status')},statuses.map(o=>h('option',{value:o.value,text:o.label,selected:o.value===s.status?'':null}))),
    origin:inp('origin','text',{maxlength:'120',value:s.origin||''}),
    destination:inp('destination','text',{maxlength:'120',value:s.destination||''}),
    packages:inp('packages','number',{min:'0',max:'100000',step:'1',value:s.packages??''}),
    shippedAt:inp('shippedAt','datetime-local',{value:toLocalInput(s.shippedAt)}),
    eta:inp('eta','date',{value:s.eta||''}),
    deliveredAt:inp('deliveredAt','datetime-local',{value:toLocalInput(s.deliveredAt)}),
    note:h('textarea',{id:id('note'),rows:'2',maxlength:'1000',text:s.note||''}),
    internalNote:h('textarea',{id:id('internalNote'),rows:'2',maxlength:'1000',text:s.internalNote||''}),
  };
  f.status.value=s.status||'pending';
  const el=h('div',{class:'ship-grid'},
    shipField(id('carrier'),'Carrier',f.carrier),shipField(id('trackingNo'),'Tracking number',f.trackingNo),
    shipField(id('trackingUrl'),'Tracking URL',f.trackingUrl),shipField(id('status'),'Status',f.status),
    shipField(id('origin'),'Origin',f.origin),shipField(id('destination'),'Destination',f.destination),
    shipField(id('packages'),'Packages',f.packages),shipField(id('eta'),'ETA',f.eta),
    shipField(id('shippedAt'),'Shipped at',f.shippedAt),shipField(id('deliveredAt'),'Delivered at',f.deliveredAt),
    shipField(id('note'),'Customer note',f.note,true),
    shipField(id('internalNote'),'Internal note (not shown to customers)',f.internalNote,true));
  const read=()=>({
    carrier:f.carrier.value,trackingNo:f.trackingNo.value,trackingUrl:f.trackingUrl.value,status:f.status.value,
    origin:f.origin.value,destination:f.destination.value,packages:f.packages.value.trim(),
    shippedAt:fromLocalInput(f.shippedAt.value),eta:f.eta.value,deliveredAt:fromLocalInput(f.deliveredAt.value),
    note:f.note.value,internalNote:f.internalNote.value,
  });
  return {el,read};
}

function renderShipmentCard(orderNo,s,idx){
  const n=s.index||idx+1;
  const form=shipmentForm('s'+s.id,s,(ship.data&&ship.data.statuses)||[]);
  const save=h('button',{type:'button'},'Save shipment');
  const del=h('button',{type:'button',class:'secondary'},'Delete shipment');
  save.addEventListener('click',()=>shipFullOp(Object.assign({op:'update',shipmentId:s.id,expectedUpdatedAt:s.updatedAt},form.read()),save,'Shipment '+n+' saved'));
  del.addEventListener('click',()=>{
    if(confirm('Delete shipment '+n+' with its timeline and photos?'))shipFullOp({op:'delete',shipmentId:s.id},del,'Shipment '+n+' deleted');
  });
  const tl=h('div',{id:'tl-'+s.id});
  const ph=h('div',{id:'ph-'+s.id});
  const meta='Updated '+fmtDate(s.updatedAt)+(s.createdBy?' · created by '+s.createdBy:'');
  const back=h('button',{type:'button',class:'secondary small',id:'shipBack'},'‹ Back to shipments');
  back.addEventListener('click',backToShipments);
  const card=h('div',{class:'ship-card'},
    h('div',{class:'row',style:'margin-bottom:10px'},back),
    h('div',{class:'row',style:'justify-content:space-between'},h('strong',{text:'Shipment '+n}),shipPill(s.status,s.statusLabel)),
    h('div',{class:'sub',text:meta}),
    form.el,
    h('div',{class:'row',style:'margin-top:10px'},save,del),
    h('h4',{text:'Timeline'}),tl,
    h('h4',{text:'Photos'}),ph);
  renderTimeline(tl,orderNo,s);
  renderPhotos(ph,orderNo,s);
  return card;
}

// POST one op. Returns the response body, or null on error (message already shown).
async function shipPost(payload,btn){
  const orderNo=ship.data&&ship.data.orderNo;
  if(!orderNo)return null;
  if(btn)btn.disabled=true;
  hide($('dMsg'));
  try{
    const b=await api(SHIP_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({orderNo},payload))});
    if(state.openNo!==orderNo)return null;
    ship.data.shipments=b.shipments||[];
    return b;
  }catch(e){
    if(e instanceof AuthError)return null;
    show($('dMsg'),e.message,true);
    if(e.status===409&&e.body&&Array.isArray(e.body.shipments)&&state.openNo===orderNo){
      ship.data.shipments=e.body.shipments;renderShipments(ship.data);
    }
    return null;
  }finally{
    if(btn&&document.contains(btn))btn.disabled=false;
  }
}
// Shipment create/update/delete: re-render the whole section from the fresh list.
async function shipFullOp(payload,btn,okMsg){
  const b=await shipPost(payload,btn);
  if(!b)return;
  renderShipments(ship.data);
  show($('dMsg'),okMsg);
}
// Event/photo ops: re-render only this card's timeline + photos, so unsaved field edits survive.
function renderShipmentChildren(sid){
  const s=(ship.data.shipments||[]).find(x=>x.id===sid);
  if(!s){renderShipments(ship.data);return}
  const tl=$('tl-'+sid),ph=$('ph-'+sid);
  if(tl)renderTimeline(tl,ship.data.orderNo,s);
  if(ph)renderPhotos(ph,ship.data.orderNo,s);
}
async function shipChildOp(payload,btn,sid,okMsg){
  const b=await shipPost(payload,btn);
  if(!b)return;
  renderShipmentChildren(sid);
  show($('dMsg'),okMsg);
}

function eventForm(px,e,statuses){
  const id=k=>px+'-'+k;
  const time=h('input',{id:id('time'),type:'datetime-local',required:'',value:toLocalInput(e.time||new Date().toISOString())});
  const st=h('select',{id:id('status')},h('option',{value:'',text:'— none —'}),
    statuses.map(o=>h('option',{value:o.value,text:o.label,selected:o.value===e.status?'':null})));
  st.value=e.status||'';
  const title=h('input',{id:id('title'),type:'text',maxlength:'160',required:'',value:e.title||''});
  const loc=h('input',{id:id('loc'),type:'text',maxlength:'120',value:e.location||''});
  const desc=h('textarea',{id:id('desc'),rows:'2',maxlength:'1000',text:e.description||''});
  const el=h('div',{class:'ship-grid'},
    shipField(id('time'),'Time',time),shipField(id('status'),'Status (optional)',st),
    shipField(id('title'),'Title',title),shipField(id('loc'),'Location',loc),
    shipField(id('desc'),'Description',desc,true));
  const read=()=>({eventTime:fromLocalInput(time.value),status:st.value,title:title.value,description:desc.value,location:loc.value});
  return {el,read};
}

function renderTimeline(c,orderNo,s){
  clear(c);
  const events=Array.isArray(s.events)?s.events:[];
  const statuses=(ship.data&&ship.data.statuses)||[];
  if(!events.length)c.appendChild(h('p',{class:'sub',text:'No events yet.'}));
  else{
    const ol=h('ol',{class:'tl'});
    for(const e of events){
      const li=h('li');
      const viewMode=()=>{
        clear(li);
        const edit=h('button',{type:'button',class:'secondary small'},'Edit');
        const del=h('button',{type:'button',class:'secondary small'},'Delete');
        edit.addEventListener('click',editMode);
        del.addEventListener('click',()=>{
          if(confirm('Delete event "'+e.title+'"?'))shipChildOp({op:'deleteEvent',shipmentId:s.id,eventId:e.id},del,s.id,'Event deleted');
        });
        li.appendChild(h('div',null,
          h('div',{class:'row'},h('span',{class:'sub',text:fmtDate(e.time)}),e.status?shipPill(e.status,e.statusLabel):null),
          h('div',{class:'tl-title',text:e.title}),
          e.location?h('div',{class:'sub',text:e.location}):null,
          e.description?h('div',{class:'tl-desc',text:e.description}):null,
          h('div',{class:'row',style:'margin-top:4px'},edit,del)));
      };
      const editMode=()=>{
        clear(li);
        const form=eventForm('ev'+e.id,e,statuses);
        const save=h('button',{type:'button',class:'small'},'Save event');
        const cancel=h('button',{type:'button',class:'secondary small'},'Cancel');
        save.addEventListener('click',()=>shipChildOp(Object.assign({op:'updateEvent',shipmentId:s.id,eventId:e.id},form.read()),save,s.id,'Event saved'));
        cancel.addEventListener('click',viewMode);
        li.appendChild(h('div',null,form.el,h('div',{class:'row'},save,cancel)));
      };
      viewMode();
      ol.appendChild(li);
    }
    c.appendChild(ol);
  }
  // Add-event form
  const max=(ship.data&&ship.data.limits&&ship.data.limits.eventsPerShipment)||100;
  const form=eventForm('evnew'+s.id,{},statuses);
  const add=h('button',{type:'button',class:'small',disabled:events.length>=max?'':null},'Add event');
  add.addEventListener('click',()=>shipChildOp(Object.assign({op:'addEvent',shipmentId:s.id},form.read()),add,s.id,'Event added'));
  c.appendChild(h('div',{style:'margin-top:8px'},h('div',{class:'sub',text:'Add an event'}),form.el,add));
}

function renderPhotos(c,orderNo,s){
  clear(c);
  const d=ship.data||{};
  const photos=Array.isArray(s.photos)?s.photos:[];
  if(photos.length){
    const grid=h('div',{class:'photos'});
    photos.forEach((p,i)=>{
      const src=safeImg(p.url);
      if(!src)return;
      const del=h('button',{type:'button',class:'secondary small'},'Delete');
      del.addEventListener('click',()=>{
        if(confirm('Delete this photo?'))shipChildOp({op:'deletePhoto',shipmentId:s.id,photoId:p.id},del,s.id,'Photo deleted');
      });
      grid.appendChild(h('figure',null,
        h('a',{href:src,target:'_blank',rel:'noopener noreferrer'},h('img',{src,alt:p.caption||'Shipment photo '+(i+1),loading:'lazy'})),
        p.caption?h('figcaption',{text:p.caption}):null,
        del));
    });
    c.appendChild(grid);
  }else c.appendChild(h('p',{class:'sub',text:'No photos yet.'}));

  const px='ph'+s.id;
  const enabled=!!d.uploadEnabled;
  const file=h('input',{id:px+'-file',type:'file',multiple:'',accept:PHOTO_TYPES.join(','),disabled:enabled?null:''});
  const cap=h('input',{id:px+'-cap',type:'text',maxlength:'200',disabled:enabled?null:''});
  const btn=h('button',{type:'button',class:'small',disabled:enabled?null:''},'Upload');
  btn.addEventListener('click',()=>uploadPhotos(orderNo,s.id,file,cap,btn));
  c.appendChild(h('div',{class:'ship-grid',style:'margin-top:8px'},
    shipField(px+'-file','Add photos (JPEG, PNG, WebP, GIF)',file),
    shipField(px+'-cap','Caption (optional)',cap)));
  c.appendChild(h('div',{class:'row'},btn,enabled?null:h('span',{class:'sub',text:'Photo upload needs R2 storage (MEDIA binding)'})));
}

async function uploadPhotos(orderNo,sid,fileInput,capInput,btn){
  const lim=(ship.data&&ship.data.limits)||{};
  const maxFiles=lim.filesPerBatch||20,maxFile=lim.maxFileBytes||10*1024*1024,maxBatch=lim.maxBatchBytes||50*1024*1024;
  const files=Array.from(fileInput.files||[]);
  const fail=m=>show($('dMsg'),m,true);
  hide($('dMsg'));
  if(!files.length)return fail('Choose at least one photo.');
  if(files.length>maxFiles)return fail('Upload at most '+maxFiles+' photos per batch.');
  if(files.some(f=>!PHOTO_TYPES.includes(f.type)))return fail('Only JPEG, PNG, WebP or GIF images are allowed.');
  if(files.some(f=>f.size<1||f.size>maxFile))return fail('Each photo must be between 1 byte and '+Math.round(maxFile/1048576)+' MB.');
  if(files.reduce((a,f)=>a+f.size,0)>maxBatch)return fail('This batch is too large (max '+Math.round(maxBatch/1048576)+' MB per upload).');
  const fd=new FormData();
  fd.append('orderNo',orderNo);fd.append('shipmentId',String(sid));
  if(capInput.value.trim())fd.append('caption',capInput.value.trim());
  for(const f of files)fd.append('file',f);
  btn.disabled=true;
  try{
    const b=await api(SHIP_UPLOAD,{method:'POST',body:fd});
    if(state.openNo!==orderNo)return;
    if(Array.isArray(b.shipments)){ship.data.shipments=b.shipments;renderShipmentChildren(sid)}
    else loadShipments(orderNo);
    show($('dMsg'),b.uploaded+' photo'+(b.uploaded===1?'':'s')+' uploaded');
  }catch(e){
    if(e instanceof AuthError)return;
    fail(e.message+(e.body&&e.body.uploaded>0?' ('+e.body.uploaded+' uploaded)':''));
    if(state.openNo===orderNo)loadShipments(orderNo); // partial-failure 500 carries no list: resync
  }finally{
    if(document.contains(btn))btn.disabled=false;
  }
}

// ---------- Wiring ----------
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{
  state.type=b.dataset.type;state.page=1;
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  load();
}));
$('statusFilter').addEventListener('change',()=>{state.status=$('statusFilter').value;state.page=1;load()});
let searchTimer=null;
$('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{state.q=$('search').value.trim().slice(0,100);state.page=1;load()},300)});
$('reload').addEventListener('click',()=>{hide($('msg'));load();if(state.openNo)openOrder(state.openNo,state.lastFocus)});
$('dClose').addEventListener('click',closeDrawer);
$('overlay').addEventListener('click',closeDrawer);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});


// Shared sign-in (admin-auth.js): valid session -> straight to the list; a 401 shows the shared login overlay.
AdminAuth.require({onReady(){showEditor();load();}});
</script>
