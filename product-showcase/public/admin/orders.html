<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Orders | Cyndi Global</title>
<style>
:root{--navy:#0f1f3a;--blue:#1e5a8a;--sky:#eef6fb;--text:#1a2a3a;--muted:#71849a;--line:#dce8f0;--orange:#e07a3a}
*{box-sizing:border-box}body{margin:0;background:var(--sky);color:var(--text);font-family:Arial,sans-serif}
header{padding:16px 5%;background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center}
header a{color:#cfe0ee;text-decoration:none;font-size:14px}header a.on{color:#fff;font-weight:700}
main{max-width:1200px;margin:24px auto;padding:0 16px}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 8px 24px #0f1f3a12;margin-bottom:16px}
.login-card{max-width:420px;margin:48px auto}
.field{margin-bottom:12px}label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px}
button{border:0;border-radius:8px;padding:9px 14px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer;font-size:13px}
button.secondary{background:#fff;color:var(--navy);border:1px solid var(--line)}
button.small{padding:5px 9px;font-size:12px}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,a:focus-visible,tr:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.msg{margin-top:10px;padding:10px;border-radius:8px;background:#e0f0f8;color:#176080;font-size:13px}
.msg.err{background:#fff1eb;color:#9a3d22}.hidden{display:none!important}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar input{width:auto;flex:1;min-width:200px}.toolbar select{width:auto}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tabs button{border-radius:0;background:#fff;color:var(--navy);font-weight:600;padding:8px 14px}
.tabs button[aria-pressed="true"]{background:var(--navy);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
#rows tr{cursor:pointer}#rows tr:hover{background:#f7fafc}#rows tr.sel{background:#eef6fb}
.sub{color:var(--muted);font-size:11px}
code{font-size:12px}
.pill{display:inline-block;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:700;background:#eef1f4;color:#45566a;white-space:nowrap}
.pill.type{background:#eef6fb;color:var(--blue)}
.st-pending{background:#fff4e0;color:#8a5a00}.st-processing{background:#e6efff;color:#1d4f9a}
.st-shipped{background:#efe8ff;color:#5b3aa6}.st-in_transit{background:#e3f4f7;color:#17707f}
.st-delivered{background:#e8f8ef;color:#217753}.st-cancelled{background:#f1e3e3;color:#9a3d22}
.pager{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:16px;flex-wrap:wrap}
.pager .pageinfo{color:var(--muted);font-size:12px;margin:0 6px}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* Detail drawer */
.overlay{position:fixed;inset:0;background:#0f1f3a55;z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:#fff;z-index:21;overflow:auto;box-shadow:-12px 0 32px #0f1f3a30;padding:22px}
.drawer h2{margin:0;font-size:20px;color:var(--navy)}
.drawer h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;font-size:13px}
.dl dt{font-size:11px;color:var(--muted)}.dl dd{margin:0;font-weight:600;word-break:break-word}
.notes{white-space:pre-wrap;word-break:break-word;background:#f7fafc;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px}
.items td{vertical-align:top}
.thumb{width:48px;height:48px;object-fit:contain;background:#f2efe9;border-radius:6px;display:block}
.thumb.ph{display:block}
.status-box{background:#f7fafc;border:1px solid var(--line);border-radius:10px;padding:14px}
.status-box select{width:auto;min-width:180px}
.totals{display:flex;justify-content:flex-end;gap:24px;margin-top:10px;font-size:13px}
.totals strong{font-size:15px}
@media(max-width:820px){.hide-sm{display:none}.dl{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <strong>CYNDI GLOBAL — ADMIN</strong>
  <nav class="row" style="gap:16px;align-items:center" aria-label="Admin">
    <a href="/admin/">Home</a>
    <a href="/admin/products">Products</a>
    <a href="/admin/orders.html" class="on" aria-current="page">Orders</a>
    <a href="/admin/customers.html">Customers</a>
    <a href="/admin/showcase">Showcase</a>
    <a href="/admin/logistics.html">Shipping</a>
    <a href="#" id="logout">Log out</a>
  </nav>
</header>
<main>
  <!-- Login -->
  <section id="loginView" class="card login-card hidden">
    <h1 style="margin:0 0 6px">Admin login</h1>
    <p style="color:var(--muted);font-size:13px;margin:0 0 16px">Sign in to view orders and update their status.</p>
    <form id="loginForm">
      <div class="field"><label for="username">Admin username</label><input id="username" type="text" autocomplete="username" required></div>
      <div class="field"><label for="password">Admin password</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button type="submit">Sign in</button>
    </form>
    <div id="loginMsg" class="msg err hidden" role="alert"></div>
  </section>

  <!-- Orders -->
  <section id="editorView" class="hidden">
    <div class="card">
      <div class="toolbar">
        <div class="tabs" role="group" aria-label="Order type">
          <button type="button" data-type="all" aria-pressed="true">All</button>
          <button type="button" data-type="SW" aria-pressed="false">Shop (SW)</button>
          <button type="button" data-type="SC" aria-pressed="false">Showcase (SC)</button>
        </div>
        <label for="statusFilter" class="hidden">Status</label>
        <select id="statusFilter" aria-label="Filter by status"><option value="">All statuses</option></select>
        <input id="search" type="search" placeholder="Search order no / name / email / company…" aria-label="Search orders">
        <button class="secondary small" id="reload" type="button">Refresh</button>
        <span id="count" style="color:var(--muted);font-size:12px" aria-live="polite"></span>
      </div>
      <div id="msg" class="msg hidden" role="status"></div>
      <table>
        <thead><tr>
          <th scope="col">Order no</th><th scope="col">Type</th><th scope="col" class="hide-sm">Created</th>
          <th scope="col">Customer / company</th><th scope="col" class="num">Items</th><th scope="col" class="num">Total</th><th scope="col">Status</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="pager" class="pager"></div>
    </div>
  </section>
</main>

<div id="overlay" class="overlay hidden"></div>
<aside id="drawer" class="drawer hidden" role="dialog" aria-modal="true" aria-labelledby="dTitle" tabindex="-1">
  <div class="row" style="justify-content:space-between">
    <div>
      <h2 id="dTitle"></h2>
      <div id="dSub" class="sub" style="margin-top:4px"></div>
    </div>
    <button type="button" class="secondary small" id="dClose">Close</button>
  </div>
  <div id="dMsg" class="msg hidden" role="status"></div>
  <div id="dBody"></div>
</aside>

<script>
// All order data is customer-supplied: it is only ever rendered via textContent /
// DOM properties (never innerHTML), image URLs are restricted to http(s) and
// mailto links are built from encoded values.
const API = '../api/admin/orders';
const PAGE_SIZE = 25;
const KNOWN = ['pending','processing','shipped','in_transit','delivered','cancelled'];
const LABELS = {pending:'Pending',processing:'Processing',shipped:'Shipped',in_transit:'In transit',delivered:'Delivered',cancelled:'Cancelled'};
const state = {type:'all', status:'', q:'', page:1, total:0, orders:[], counts:{}, openNo:null, lastFocus:null};

function $(id){return document.getElementById(id)}
function show(el,text,err){el.textContent=text;el.className='msg'+(err?' err':'');el.classList.remove('hidden')}
function hide(el){el.classList.add('hidden')}
// Tiny DOM builder: children are nodes or strings (strings become text nodes).
function h(tag,props,...kids){
  const n=document.createElement(tag);
  if(props)for(const [k,v] of Object.entries(props)){
    if(v==null||v===false)continue;
    if(k==='class')n.className=v;
    else if(k==='text')n.textContent=v;
    else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);
    else n.setAttribute(k,String(v));
  }
  for(const c of kids.flat()){if(c==null||c===false)continue;n.appendChild(typeof c==='object'?c:document.createTextNode(String(c)))}
  return n;
}
function clear(n){while(n.firstChild)n.removeChild(n.firstChild)}

class AuthError extends Error{}
async function api(url,opts){
  const r=await fetch(url,Object.assign({credentials:'same-origin'},opts||{}));
  const b=await r.json().catch(()=>({}));
  if(r.status===401){showLogin();throw new AuthError('Please sign in again');}
  if(!r.ok){const e=new Error(b.error||'Request failed');e.status=r.status;e.body=b;throw e;}
  return b;
}

function label(s){return LABELS[s]||String(s||'—')}
function badge(s){return h('span',{class:'pill '+(KNOWN.includes(s)?'st-'+s:''),text:label(s)})}
function sym(c){if(!c)return '';if(c==='USD'||c==='$')return '$';if(c==='CNY'||c==='¥')return '¥';return String(c)+' '}
function money(v,c){const n=Number(v);return Number.isFinite(n)?sym(c)+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'—'}
function fmtDate(v){if(!v)return '—';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'})}
function safeImg(raw){
  if(typeof raw!=='string'||!raw.trim())return null;
  try{const u=new URL(raw.trim(),location.origin);return (u.protocol==='http:'||u.protocol==='https:')?u.href:null}catch{return null}
}
const EMAIL_RE=/^[^@\s<>"'()\\,;:]+@[^@\s<>"'()\\,;:]+\.[^@\s<>"'()\\,;:]+$/;

function showLogin(){$('editorView').classList.add('hidden');$('loginView').classList.remove('hidden');closeDrawer()}
function showEditor(){$('loginView').classList.add('hidden');$('editorView').classList.remove('hidden')}

// ---------- List ----------
async function load(){
  const p=new URLSearchParams({type:state.type,page:String(state.page),pageSize:String(PAGE_SIZE)});
  if(state.status)p.set('status',state.status);
  if(state.q)p.set('q',state.q);
  try{
    const b=await api(API+'?'+p.toString());
    showEditor();
    state.orders=b.orders||[];state.total=b.total||0;state.counts=b.statusCounts||{};
    const pages=Math.max(1,Math.ceil(state.total/PAGE_SIZE));
    if(state.page>pages&&state.total>0){state.page=pages;return load();}
    renderStatusFilter();renderRows();renderPager(pages);
    $('count').textContent=state.total+' order'+(state.total===1?'':'s');
  }catch(e){if(!(e instanceof AuthError))show($('msg'),e.message,true)}
}

function renderStatusFilter(){
  const sel=$('statusFilter');const cur=state.status;
  clear(sel);
  const all=Object.values(state.counts).reduce((a,n)=>a+(Number(n)||0),0);
  sel.appendChild(h('option',{value:'',text:'All statuses ('+all+')'}));
  const keys=[...KNOWN,...Object.keys(state.counts).filter(k=>!KNOWN.includes(k))];
  for(const k of keys)sel.appendChild(h('option',{value:k,text:label(k)+' ('+(state.counts[k]||0)+')'}));
  if(cur&&!keys.includes(cur))sel.appendChild(h('option',{value:cur,text:label(cur)+' (0)'}));
  sel.value=cur;
}

function renderRows(){
  const tb=$('rows');clear(tb);
  if(!state.orders.length){tb.appendChild(h('tr',null,h('td',{colspan:'7',class:'empty',text:'No orders match.'})));return;}
  for(const o of state.orders){
    const who=[o.customerName,o.company].filter(Boolean).join(' · ');
    const tr=h('tr',{tabindex:'0','data-no':o.orderNo,class:o.orderNo===state.openNo?'sel':null,'aria-label':'Open order '+o.orderNo},
      h('td',null,h('code',{text:o.orderNo})),
      h('td',null,h('span',{class:'pill type',text:o.type||'—'})),
      h('td',{class:'hide-sm'},fmtDate(o.createdAt)),
      h('td',null,h('div',{text:who||'—'}),h('div',{class:'sub',text:o.customerEmail||''})),
      h('td',{class:'num',text:String(o.itemCount??'—')}),
      h('td',{class:'num',text:money(o.total,o.currency)}),
      h('td',null,badge(o.status)));
    tr.addEventListener('click',()=>openOrder(o.orderNo,tr));
    tr.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openOrder(o.orderNo,tr)}});
    tb.appendChild(tr);
  }
}

function renderPager(pages){
  const el=$('pager');clear(el);
  if(pages<=1)return;
  el.appendChild(h('button',{type:'button',class:'secondary small',disabled:state.page<=1?'':null,onclick:()=>{state.page--;load()}},'‹ Prev'));
  el.appendChild(h('span',{class:'pageinfo',text:'Page '+state.page+' / '+pages}));
  el.appendChild(h('button',{type:'button',class:'secondary small',disabled:state.page>=pages?'':null,onclick:()=>{state.page++;load()}},'Next ›'));
}

// ---------- Detail ----------
async function openOrder(no,fromEl){
  state.openNo=no;state.lastFocus=fromEl||document.activeElement;
  document.querySelectorAll('#rows tr').forEach(r=>r.classList.toggle('sel',r.dataset.no===no));
  $('dTitle').textContent=no;$('dSub').textContent='Loading…';clear($('dBody'));hide($('dMsg'));
  $('overlay').classList.remove('hidden');$('drawer').classList.remove('hidden');$('drawer').focus();
  try{const b=await api(API+'?orderNo='+encodeURIComponent(no));renderDetail(b.order)}
  catch(e){if(!(e instanceof AuthError)){$('dSub').textContent='';show($('dMsg'),e.message,true)}}
}

function closeDrawer(){
  if($('drawer').classList.contains('hidden'))return;
  $('overlay').classList.add('hidden');$('drawer').classList.add('hidden');state.openNo=null;
  document.querySelectorAll('#rows tr.sel').forEach(r=>r.classList.remove('sel'));
  if(state.lastFocus&&document.contains(state.lastFocus))state.lastFocus.focus();
}

function dlItem(term,value){return [h('dt',{text:term}),h('dd',null,value==null||value===''?'—':value)]}

function emailNode(email){
  if(!email)return '—';
  if(!EMAIL_RE.test(email))return String(email);
  return h('a',{href:'mailto:'+encodeURIComponent(email),text:email});
}

function renderDetail(o){
  $('dTitle').textContent=o.orderNo;
  $('dSub').textContent=(o.type==='SC'?'Showcase order':o.type==='SW'?'Shop order':'Order')+' · created '+fmtDate(o.createdAt)+' · updated '+fmtDate(o.statusUpdatedAt);
  const body=$('dBody');clear(body);
  const c=o.contact||{};

  // Status
  const box=h('div',{class:'status-box'});
  box.appendChild(h('div',{class:'row'},h('span',{class:'sub',text:'Current status'}),badge(o.status)));
  const next=Array.isArray(o.allowedNext)?o.allowedNext:[];
  if(!next.length){
    box.appendChild(h('p',{class:'sub',style:'margin:10px 0 0',text:'This is a final status and cannot be changed.'}));
  }else{
    const sel=h('select',{id:'nextStatus','aria-label':'New status'},h('option',{value:'',text:'Change status to…'}),
      next.map(s=>h('option',{value:s.value,text:s.label||label(s.value)})));
    const btn=h('button',{type:'button',disabled:''},'Update status');
    sel.addEventListener('change',()=>{btn.disabled=!sel.value});
    btn.addEventListener('click',()=>changeStatus(o,sel.value,btn));
    box.appendChild(h('div',{class:'row',style:'margin-top:10px'},h('label',{for:'nextStatus',class:'hidden',text:'New status'}),sel,btn));
  }
  body.appendChild(h('h3',{text:'Status'}));body.appendChild(box);

  // Contact
  body.appendChild(h('h3',{text:'Contact'}));
  body.appendChild(h('dl',{class:'dl'},
    dlItem('Name',c.name),dlItem('Email',emailNode(c.email)),dlItem('Phone',c.phone),dlItem('Company',c.company),
    o.placedBy?dlItem('Placed by (showcase account)',o.placedBy):null));

  // Customer account (orders placed while signed in)
  if(o.customerId){
    const a=o.account;
    body.appendChild(h('h3',{text:'Customer account'}));
    body.appendChild(h('dl',{class:'dl'},
      dlItem('Account',a?h('a',{href:'/admin/customers.html',text:'#'+o.customerId}):'#'+o.customerId+' (deleted)'),
      a?dlItem('Login email',a.email):null,
      a?dlItem('Username',a.username):null,
      a?dlItem('Client',a.clientCode?(a.clientCode+(a.clientName&&a.clientName!==a.clientCode?' — '+a.clientName:'')):'—'):null,
      a&&a.status&&a.status!=='active'?dlItem('Account status',a.status):null));
  }

  if(o.notes){body.appendChild(h('h3',{text:'Notes'}));body.appendChild(h('div',{class:'notes',text:o.notes}))}

  // Items
  const items=Array.isArray(o.items)?o.items:[];
  body.appendChild(h('h3',{text:'Line items ('+items.length+')'}));
  const tbody=h('tbody');
  for(const it of items){
    if(!it||typeof it!=='object')continue;
    const qty=Number(it.quantity)||0;
    const unit=it.unitPrice!=null?it.unitPrice:it.price;
    const line=it.lineTotal!=null?it.lineTotal:(Number(unit)||0)*qty;
    const cur=it.currency||o.currency;
    const src=safeImg(it.image);
    const extra=[];
    if(it.moq!=null&&Number(it.moq)>1)extra.push('MOQ '+it.moq);
    if(it.leadTime!=null&&it.leadTime!=='')extra.push('Lead time '+it.leadTime+' days');
    tbody.appendChild(h('tr',null,
      h('td',null,src?h('img',{class:'thumb',src:src,alt:'',loading:'lazy',referrerpolicy:'no-referrer'}):h('span',{class:'thumb ph','aria-hidden':'true'})),
      h('td',null,h('div',{style:'font-weight:600',text:it.name||'—'}),
        h('div',{class:'sub',text:[it.sku,it.productId||it.id].filter(Boolean).join(' · ')}),
        extra.length?h('div',{class:'sub',text:extra.join(' · ')}):null),
      h('td',{text:it.colorName||it.selectedColor||'—'}),
      h('td',{text:it.size||it.selectedSize||'—'}),
      h('td',{class:'num',text:String(qty)}),
      h('td',{class:'num',text:money(unit,cur)}),
      h('td',{class:'num',text:money(line,cur)})));
  }
  body.appendChild(h('table',{class:'items'},
    h('thead',null,h('tr',null,h('th',{scope:'col'},h('span',{class:'hidden',text:'Image'})),h('th',{scope:'col',text:'Product'}),h('th',{scope:'col',text:'Colour'}),
      h('th',{scope:'col',text:'Size'}),h('th',{scope:'col',class:'num',text:'Qty'}),h('th',{scope:'col',class:'num',text:'Unit'}),h('th',{scope:'col',class:'num',text:'Line total'}))),
    tbody));
  body.appendChild(h('div',{class:'totals'},
    h('span',null,'Units: ',h('strong',{text:String(o.itemCount??'—')})),
    h('span',null,'Total: ',h('strong',{text:money(o.total,o.currency)}))));
}

async function changeStatus(o,to,btn){
  if(!to)return;
  const msg='Change '+o.orderNo+' from '+label(o.status)+' to '+label(to)+'?';
  if(!confirm(msg))return;
  if(to==='cancelled'&&!confirm('Cancelling is final: a cancelled order cannot be reopened. Cancel '+o.orderNo+'?'))return;
  btn.disabled=true;hide($('dMsg'));
  try{
    const b=await api(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderNo:o.orderNo,status:to,expectedStatus:o.status})});
    renderDetail(b.order);
    show($('dMsg'),o.orderNo+' is now '+label(b.order.status));
  }catch(e){
    if(e instanceof AuthError)return;
    show($('dMsg'),e.message,true);
    if(e.status===409&&e.body&&e.body.order)renderDetail(e.body.order);
    else btn.disabled=false;
  }
  load();
}

// ---------- Wiring ----------
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{
  state.type=b.dataset.type;state.page=1;
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  load();
}));
$('statusFilter').addEventListener('change',()=>{state.status=$('statusFilter').value;state.page=1;load()});
let searchTimer=null;
$('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{state.q=$('search').value.trim().slice(0,100);state.page=1;load()},300)});
$('reload').addEventListener('click',()=>{hide($('msg'));load();if(state.openNo)openOrder(state.openNo,state.lastFocus)});
$('dClose').addEventListener('click',closeDrawer);
$('overlay').addEventListener('click',closeDrawer);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});

$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();hide($('loginMsg'));
  try{
    const r=await fetch('../api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value.trim(),password:$('password').value})});
    const b=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(b.error||'Sign in failed');
    $('password').value='';showEditor();load();
  }catch(err){show($('loginMsg'),err.message,true)}
});
$('logout').addEventListener('click',async e=>{e.preventDefault();await fetch('../api/admin/logout',{method:'POST'});location.reload()});

// Already signed in -> straight to the list; a 401 shows the login form.
load();
</script>
</body>
</html>
