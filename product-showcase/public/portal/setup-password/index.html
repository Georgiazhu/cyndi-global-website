<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Set password | Cyndi Global Portal</title>
<style>
:root{--ink:#1c1917;--oat:#8C7B66;--bg:#F5F1EA;--line:#e4ddd1;--muted:#6b6258}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
.topbar{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 6%;border-bottom:1px solid var(--line);background:#fff}
.topbar img{height:30px;width:auto;display:block}
.topbar .side{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--oat)}
.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 20px}
.card{width:100%;max-width:440px}
.brand{text-align:center;margin-bottom:30px}
.brand .kicker{font-size:11px;letter-spacing:.28em;color:var(--oat);font-weight:700}
.brand h1{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:8px 0 6px}
.brand p{font-size:13px;color:var(--muted)}
.form{background:#fff;border:1px solid var(--line);border-radius:14px;padding:30px;box-shadow:0 16px 40px rgba(28,25,23,.06)}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:#57534e;margin-bottom:7px}
.field input{width:100%;padding:13px 14px;border:1px solid #ddd5c7;border-radius:9px;font-size:14px;color:var(--ink);outline:none;transition:.15s}
.field input:focus{border-color:var(--oat);box-shadow:0 0 0 3px rgba(140,123,102,.16)}
.req{margin:2px 0 18px;padding:12px 14px;background:var(--bg);border-radius:8px;font-size:11.5px;color:var(--muted);line-height:1.9}
.req b{color:#6b5c48}.req .ok{color:#3f7a52}
.btn{width:100%;padding:14px;border:0;border-radius:9px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;cursor:pointer;transition:.15s}
.btn:hover{background:#000}.btn:disabled{opacity:.55;cursor:default}
.msg{margin-bottom:16px;padding:11px 13px;border-radius:8px;font-size:13px;display:none}
.msg.err{display:block;background:#fff1eb;color:#9a3d22}
.fine{margin-top:24px;text-align:center;font-size:11px;color:#9a9186;line-height:1.8}
</style>
</head>
<body>
<div class="topbar">
  <a href="/"><img src="/cyndi-logo-full-v5.png" alt="Cyndi Global"></a>
  <span class="side">Confidential portal</span>
</div>
<div class="wrap">
  <div class="card">
    <div class="brand">
      <div class="kicker">FIRST-TIME SETUP</div>
      <h1>Set your password</h1>
      <p id="who">Please create a password for your account</p>
    </div>
    <form class="form" id="f">
      <div id="msg" class="msg" role="alert"></div>
      <div class="field">
        <label for="p1">New password</label>
        <input id="p1" type="password" autocomplete="new-password" placeholder="At least 8 characters" required>
      </div>
      <div class="field">
        <label for="p2">Confirm new password</label>
        <input id="p2" type="password" autocomplete="new-password" placeholder="Re-enter your password" required>
      </div>
      <div class="req">
        <b>Password requirements</b><br>
        <span id="r8">○</span> At least 8 characters &nbsp; <span id="ru">○</span> One uppercase letter<br>
        <span id="rn">○</span> One number &nbsp; <span id="rm">○</span> Match confirmation
      </div>
      <button class="btn" id="submit" type="submit">Create password &amp; continue</button>
    </form>
    <div class="fine">Once set, use this password for all future sign-ins.</div>
  </div>
</div>
<script>
const $ = (s) => document.querySelector(s);
function mark(id, ok) { const e=$(id); e.textContent = ok?'✓':'○'; e.className = ok?'ok':''; return ok; }
function validate() {
  const a=$('#p1').value, b=$('#p2').value;
  const ok8=a.length>=8, okU=/[A-Z]/.test(a), okN=/[0-9]/.test(a), okM=a.length>0&&a===b;
  mark('#r8',ok8); mark('#ru',okU); mark('#rn',okN); mark('#rm',okM);
  return ok8&&okU&&okN&&okM;
}
['#p1','#p2'].forEach(s=>$(s).addEventListener('input',validate));
(async () => {
  try {
    const r = await fetch('/api/me', { cache:'no-store' });
    const d = await r.json();
    if (d.user?.email) $('#who').textContent = `Welcome — create a password for ${d.user.email}`;
    if (!d.user) location.href='/portal/login/';
  } catch {}
})();
$('#f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg=$('#msg');
  if (!validate()) { msg.textContent='Please meet all password requirements.'; msg.style.display='block'; return; }
  const btn=$('#submit'); btn.disabled=true; btn.textContent='Saving…'; msg.style.display='none';
  try {
    const res = await fetch('/api/set-initial-password', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ newPassword: $('#p1').value }),
    });
    const d = await res.json().catch(()=>({}));
    if (!res.ok) throw new Error(d.error || 'Could not set password');
    location.href='/portal/';
  } catch(err) {
    msg.textContent=err.message||'Could not set password'; msg.style.display='block';
    btn.disabled=false; btn.textContent='Create password & continue';
  }
});
</script>
</body>
</html>
