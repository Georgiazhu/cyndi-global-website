name: Debug Pages build v2

# 精确复现 Cloudflare Pages 的构建：
#   cd product-showcase && npm install && npm run build
# 重点：干净安装 + 检查 postbuild 是否被触发 + 产物结构
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    name: Reproduce Pages build exactly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo layout
        run: |
          ls -la
          echo "--- root functions ---"
          find functions -type f | sort
          echo "--- node/npm versions ---"
          node -v && npm -v

      - name: Clean install (as Pages does)
        run: |
          cd product-showcase
          rm -rf node_modules
          npm install 2>&1 | tail -10

      - name: Build with full output
        run: |
          cd product-showcase
          npm run build 2>&1 | tail -25
          echo "=== EXIT: $? ==="

      - name: Verify output structure
        run: |
          cd product-showcase
          echo "--- dist tree (top) ---"
          find dist -maxdepth 2 -not -path "*/images/*" | sort | head -40
          echo "--- dist/showcase ---"
          ls -la dist/showcase 2>&1 | head -10
          echo "--- showcase index.html ---"
          cat dist/showcase/index.html 2>&1 | head -20

      - name: Check for Functions build issues
        run: |
          echo "--- functions/api tree ---"
          find functions/api -type f | sort
          echo "--- showcase api files syntax check ---"
          for f in functions/api/showcase.js functions/api/showcase/media.js functions/api/admin/showcase.js functions/api/admin/showcase/upload.js; do
            node --input-type=module -e "
              import('file://$PWD/$f').then(()=>console.log('OK   $f')).catch(e=>console.log('FAIL $f ->', e.message))
            " 2>&1 | head -3
          done
