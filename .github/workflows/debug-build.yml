name: Debug Pages build v3

# 复现 Cloudflare Pages 的构建 + Functions 打包，找出构建失败的真实原因。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    name: Reproduce Pages build with Functions bundling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build frontend
        run: |
          cd product-showcase
          npm install --no-audit --no-fund 2>&1 | tail -3
          npm run build 2>&1 | tail -12

      - name: Check Functions syntax
        run: |
          cd "$GITHUB_WORKSPACE"
          for f in $(find functions -name "*.js" | sort); do
            if ! node --check "$f" 2>/tmp/err.txt; then
              echo "SYNTAX FAIL: $f"
              cat /tmp/err.txt
            fi
          done
          echo "--- syntax check done ---"

      - name: Resolve every relative import
        run: |
          cd "$GITHUB_WORKSPACE"
          node -e "
          const fs=require('fs'),path=require('path');
          function walk(d){return fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>{
            const p=path.join(d,e.name);
            return e.isDirectory()?walk(p):(p.endsWith('.js')?[p]:[]);});}
          let bad=0;
          for(const f of walk('functions')){
            const src=fs.readFileSync(f,'utf8');
            for(const m of src.matchAll(/from\s+'([^']+)'/g)){
              const spec=m[1];
              if(!spec.startsWith('.'))continue;
              const t=path.resolve(path.dirname(f),spec);
              if(!fs.existsSync(t)){console.log('MISSING',f,'->',spec);bad++;}
            }
          }
          console.log('missing imports:',bad);
          "

      - name: Check _worker.js parses as ESM module
        run: |
          cd "$GITHUB_WORKSPACE"
          node --input-type=module -e "
            import('file://$PWD/_worker.js').then(m=>console.log('worker module OK, exports:', Object.keys(m))).catch(e=>{console.log('WORKER IMPORT FAIL:', e.message)})
          "

      - name: Try wrangler pages functions build
        run: |
          cd "$GITHUB_WORKSPACE"
          npx --yes wrangler@latest pages functions build --outdir=functions-dist 2>&1 | tail -40 || echo "wrangler pages functions build unavailable"

      - name: Inspect compiled functions bundle
        run: |
          cd "$GITHUB_WORKSPACE"
          echo "--- functions-dist ---"
          find functions-dist -type f 2>/dev/null | head -30
          echo "--- showcase routes in bundle ---"
          grep -rl "showcase" functions-dist 2>/dev/null | head -10
          echo "--- check bundle for auth route ---"
          grep -rho "api/showcase/auth" functions-dist 2>/dev/null | head -3
          echo "--- worker bundle ---"
          find functions-dist -name "*worker*" -type f 2>/dev/null | head -5

      - name: Wrangler pages deploy dry-run
        run: |
          cd "$GITHUB_WORKSPACE"
          npx --yes wrangler@latest pages deploy --help 2>&1 | head -30 || true
        continue-on-error: true
