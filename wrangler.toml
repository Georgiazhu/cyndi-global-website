# 本地开发配置（wrangler pages dev）。
# 线上 Cloudflare Pages 的绑定在控制台配置；此文件主要用于本地跑 functions + 本地 D1。
name = "cyndi-global-website"
compatibility_date = "2024-09-01"
pages_build_output_dir = "product-showcase/dist"

# D1 数据库绑定（本地 dev 用本地 SQLite；线上绑到 cyndi-logistics）
[[d1_databases]]
binding = "DB"
database_name = "cyndi-logistics"
database_id = "016ad95b-a8eb-4ea3-afdc-b1573b906e7a"

# R2 图片存储（本地 dev 用本地模拟；线上绑到 cyndi-products）
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "cyndi-products"

# 商品图公开 URL 前缀。
# 线上在 Cloudflare Pages 环境变量设 R2_PUBLIC_BASE=https://img.cyndiglobal.com
# 本地不设 -> 返回相对 /images/products/...（本地 R2 模拟，仅验证流程）。
